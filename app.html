<!DOCTYPE html>
<html>
<head>
  <title>Contact Hub App</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="top-bar">
  <h2>📇 Contact Hub</h2>
  <input id="search" placeholder="Search contacts..." onkeyup="searchContact()">
  <button onclick="voiceSearch()">🎤</button>
</header>

<nav class="menu">
  <button onclick="openForm()">➕ Add</button>
  <button onclick="showFavorites()">⭐ Favorites</button>
  <button onclick="showCallHistory()">📞 History</button>
  <button onclick="showReminders()">⏰ Reminders</button>
  <button onclick="togglePrivate()">🔒 Privacy</button>
  <button onclick="showTrash()">🗑 Trash</button>
</nav>

<div id="contactList"></div>

<div id="modal" class="modal">
  <div class="modal-content">
    <input id="name" placeholder="Name">
    <input id="phone" placeholder="Phone">
    <input id="birthday" type="date">
    <select id="blood">
      <option>O+</option><option>O-</option>
      <option>A+</option><option>A-</option>
      <option>B+</option><option>B-</option>
      <option>AB+</option><option>AB-</option>
    </select>
    <input id="group" placeholder="Group (Family/Class)">
    <button onclick="saveContact()">Save</button>
    <button onclick="closeForm()">Close</button>
  </div>
</div>

<script src="js/contacts.js"></script>
<script src="js/ui.js"></script>
<script src="js/callHistory.js"></script>
<script src="js/reminders.js"></script>
<script src="js/privacy.js"></script>
</body>
</html>
