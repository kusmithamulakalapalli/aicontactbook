<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Hub 3.0</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
body{min-height:100vh;background:linear-gradient(135deg,#667eea,#764ba2);color:#333;}
#splash{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#1a1a2e;color:white;z-index:1000;}
#splash .title{font-size:4rem;color:#4ecdc4;text-shadow:0 0 20px #4ecdc4;animation:glow 2s infinite;}
@keyframes glow{0%,100%{text-shadow:0 0 20px #4ecdc4;}50%{text-shadow:0 0 40px #ff6b6b;}}
.enter-btn{margin-top:2rem;padding:15px 40px;font-size:1.2rem;border-radius:50px;border:none;background:linear-gradient(45deg,#ff6b6b,#4ecdc4);color:white;cursor:pointer;animation:bounce 2s infinite;}
@keyframes bounce{0%,20%,50%,80%,100%{transform:translateY(0);}40%{transform:translateY(-10px);}60%{transform:translateY(-5px);}}
#login-page{display:none;min-height:100vh;justify-content:center;align-items:center;padding:2rem;}
.login-card{background:rgba(255,255,255,0.95);backdrop-filter:blur(20px);padding:3rem;border-radius:20px;text-align:center;max-width:400px;width:100%;}
.login-card h2{margin-bottom:2rem;color:#333;}
.login-card input{width:100%;padding:15px;margin:1rem 0;border-radius:10px;border:2px solid #eee;font-size:1rem;}
.login-btn{background:linear-gradient(45deg,#667eea,#764ba2);color:white;padding:15px;width:100%;border:none;border-radius:10px;font-size:1.1rem;cursor:pointer;}
#app{display:none;min-height:100vh;}
.header{padding:1rem 2rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap;background:rgba(255,255,255,0.95);backdrop-filter:blur(10px);}
.nav-tabs{display:flex;gap:0;background:rgba(102,126,234,0.2);border-radius:15px;padding:5px;margin-right:auto;}
.tab-btn{background:transparent;border:none;padding:12px 24px;color:rgba(255,255,255,0.8);border-radius:12px;cursor:pointer;font-weight:500;transition:all 0.3s;display:flex;align-items:center;gap:8px;font-size:0.95rem;}
.tab-btn.active{background:rgba(255,255,255,0.95);color:#333;box-shadow:0 5px 20px rgba(0,0,0,0.2);}
.tab-btn:hover:not(.active){background:rgba(255,255,255,0.3);color:white;}
.controls{display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap;}
#search{padding:10px 20px;border:2px solid #667eea;border-radius:25px;background:white;min-width:200px;}
#voice-btn,#add-contact{padding:10px 16px;border-radius:25px;border:none;color:white;cursor:pointer;font-weight:500;}
#voice-btn{background:linear-gradient(45deg,#ff6b6b,#ff5252);}
#add-contact{background:linear-gradient(45deg,#4ecdc4,#44a08d);}
.app-page{display:none;padding:2rem;min-height:calc(100vh - 140px);background:rgba(255,255,255,0.05);}
.app-page.active{display:block;}
.page-title{padding:1rem 0;border-bottom:2px solid rgba(255,255,255,0.1);margin-bottom:2rem;color:white;}
.contacts-grid,.groups-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.5rem;max-width:1400px;margin:0 auto;}
.contact-card{background:rgba(255,255,255,0.95);border-radius:20px;padding:1.5rem;position:relative;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,0.1);}
.contact-card:hover{transform:translateY(-5px);box-shadow:0 20px 60px rgba(0,0,0,0.2);}
.contact-avatar{width:60px;height:60px;border-radius:50%;background:linear-gradient(45deg,#667eea,#764ba2);color:white;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:1.2rem;margin-bottom:1rem;}
.contact-name{font-size:1.4rem;font-weight:bold;color:#333;margin-bottom:0.5rem;}
.contact-phone,.contact-email{color:#666;font-size:1rem;margin-bottom:0.5rem;}
.contact-actions{display:flex;gap:0.5rem;margin-top:1rem;}
.action-btn{padding:8px 12px;border:none;border-radius:50%;cursor:pointer;font-size:1rem;width:40px;height:40px;display:flex;align-items:center;justify-content:center;}
.call-btn{background:#4ecdc4;color:white;}
.msg-btn{background:#f9ca24;color:white;}
.edit-btn{background:#667eea;color:white;}
.delete-btn{background:#ff6b6b;color:white;}
.fav-btn{position:absolute;top:15px;right:15px;background:none;border:none;font-size:1.5rem;color:#ffd700;cursor:pointer;}
.fav-btn.active{color:#ff6b6b;}
.location-btn{background:linear-gradient(45deg,#45b7d1,#96ceb4);color:white;width:100%;border:none;padding:8px;margin-top:0.5rem;border-radius:10px;}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);justify-content:center;align-items:center;z-index:1000;}
.modal-content{background:white;padding:2rem;border-radius:20px;width:90%;max-width:500px;max-height:80vh;overflow-y:auto;position:relative;}
.close{position:absolute;top:20px;right:30px;font-size:2rem;cursor:pointer;color:#999;}
select,textarea,input{width:100%;padding:12px;margin:0.5rem 0;border:2px solid #eee;border-radius:10px;}
@media(max-width:768px){.contacts-grid,.groups-grid{grid-template-columns:1fr;padding:1rem;}.header{flex-direction:column;text-align:center;}.nav-tabs{width:100%;justify-content:center;}.controls{width:100%;justify-content:center;}}
</style>
</head>
<body>

<!-- Splash -->
<div id="splash">
  <div class="title">Contact Hub</div>
  <button class="enter-btn" onclick="enterApp()">Enter <i class="fas fa-arrow-right"></i></button>
</div>

<!-- Login -->
<div id="login-page">
  <div class="login-card">
    <h2>Login</h2>
    <input id="username" placeholder="Username" value="admin">
    <input id="password" type="password" placeholder="Password" value="123">
    <button class="login-btn" onclick="login()">Login</button>
  </div>
</div>

<!-- App -->
<div id="app">
  <div class="header">
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="showPage('all')">All</button>
      <button class="tab-btn" onclick="showPage('fav')">Favorites</button>
      <button class="tab-btn" onclick="showPage('groups')">Groups</button>
      <button class="tab-btn" onclick="showPage('trash')">Trash</button>
      <button class="tab-btn" onclick="showPage('history')">Call History</button>
    </div>
    <div class="controls">
      <input id="search" placeholder="Search..." oninput="searchContacts()">
      <button id="voice-btn" onclick="toggleVoiceSearch()"><i class="fas fa-microphone"></i></button>
      <button id="add-contact" onclick="openModal('add')"><i class="fas fa-plus"></i></button>
    </div>
  </div>

  <!-- Pages -->
  <div id="page-all" class="app-page active"><div class="contacts-grid" id="contacts-grid-all"></div></div>
  <div id="page-fav" class="app-page"><div class="contacts-grid" id="contacts-grid-fav"></div></div>
  <div id="page-groups" class="app-page"><div class="groups-grid" id="groups-grid"></div></div>
  <div id="page-trash" class="app-page"><div class="contacts-grid" id="trash-grid"></div></div>
  <div id="page-history" class="app-page"><div class="contacts-grid" id="callhistory-grid"></div></div>
</div>

<!-- Modal -->
<div id="modal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <h2 id="modal-title">Add Contact</h2>
    <form id="contact-form">
      <input type="file" id="avatar" onchange="previewAvatar()">
      <div class="contact-avatar" id="avatar-preview">👤</div>
      <input id="name" placeholder="Name*" required>
      <input id="phone" placeholder="Phone">
      <input id="email" placeholder="Email">
      <input type="date" id="birthday">
      <input id="group" placeholder="Group">
      <input id="blood" placeholder="Blood Group">
      <label><input type="checkbox" id="emergency"> Emergency</label>
      <label><input type="checkbox" id="private"> Private</label>
      <textarea id="notes" placeholder="Notes"></textarea>
      <button type="submit" class="login-btn">Save</button>
    </form>
  </div>
</div>

<script>
let contacts=JSON.parse(localStorage.getItem('contacts'))||[];
let trash=JSON.parse(localStorage.getItem('trash'))||[];
let callHistory=JSON.parse(localStorage.getItem('callHistory'))||[];
let editingId=null,recognition=null,currentPage='all';

function enterApp(){document.getElementById('splash').style.display='none';document.getElementById('login-page').style.display='flex';}
function login(){document.getElementById('login-page').style.display='none';document.getElementById('app').style.display='block';renderAllContacts();renderFavorites();renderGroups();renderTrash();renderCallHistory();}
function showPage(page){document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));event.target.classList.add('active');document.querySelectorAll('.app-page').forEach(p=>p.classList.remove('active'));document.getElementById('page-'+page).classList.add('active');currentPage=page;renderAllContacts();renderFavorites();renderGroups();renderTrash();renderCallHistory();}

function renderAllContacts(){document.getElementById('contacts-grid-all').innerHTML=createContactHTML(contacts);}
function renderFavorites(){document.getElementById('contacts-grid-fav').innerHTML=createContactHTML(contacts.filter(c=>c.favorite));}
function renderGroups(){let groups={};contacts.forEach(c=>{let g=c.group||'Uncategorized';if(!groups[g])groups[g]=[];groups[g].push(c);});document.getElementById('groups-grid').innerHTML=Object.entries(groups).map(([name,cs],i)=>`<div class="group-card" onclick="showGroup('${name}')"><div class="group-color" style="background:linear-gradient(45deg,hsl(${i*45},70%,50%),hsl(${i*45+30},70%,50%))"></div><div class="group-name">${name}</div><div class="group-count">${cs.length}</div></div>`).join('');}
function renderTrash(){document.getElementById('trash-grid').innerHTML=createContactHTML(trash,true);}
function renderCallHistory(){document.getElementById('callhistory-grid').innerHTML=callHistory.map(c=>`<div class="contact-card"><div class="contact-name">${c.name||c.phone}</div><div class="contact-phone">${c.phone}</div><div class="contact-actions"><span style="padding:5px;border-radius:5px;background:#eee;font-size:0.8rem;">${c.type}-${c.time}</span></div></div>`).join('');}

function createContactHTML(list,isTrash=false){return list.map(c=>`<div class="contact-card">
<div class="contact-avatar">${c.avatar?`<img src="${c.avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`:'👤'}</div>
<div class="contact-name">${c.name}</div><div class="contact-phone">${c.phone||''}</div><div class="contact-email">${c.email||''}</div>
${c.group?`<div class="group-tag">${c.group}</div>`:''}${c.emergency?`<div class="reminder">Emergency</div>`:''}
<div class="contact-actions">
${!isTrash?`<button class="action-btn call-btn" onclick="callContact('${c.phone}')"><i class="fas fa-phone"></i></button>
<button class="action-btn msg-btn" onclick="msgContact('${c.phone}')"><i class="fas fa-comment"></i></button>
<button class="action-btn edit-btn" onclick="editContact('${c.id}')"><i class="fas fa-edit"></i></button>`:''}
<button class="action-btn delete-btn" onclick="${isTrash?`deleteForever('${c.id}')`:`deleteContact('${c.id}')`}"><i class="fas fa-trash"></i></button>
</div>
<button class="fav-btn ${c.favorite?'active':''}" onclick="toggleFavorite('${c.id}')"><i class="fas fa-heart"></i></button>
${c.location?`<button class="location-btn" onclick="openLocation('${c.location}')">View Location</button>`:''}
</div>`).join('');}

function openModal(mode){document.getElementById('modal').style.display='flex';document.getElementById('modal-title').textContent=mode==='add'?'Add Contact':'Edit Contact';if(mode==='add'){editingId=null;document.getElementById('contact-form').reset();document.getElementById('avatar-preview').innerHTML='👤';}}
function closeModal(){document.getElementById('modal').style.display='none';}

function previewAvatar(){const file=document.getElementById('avatar').files[0];if(file){const reader=new FileReader();reader.onload=()=>{document.getElementById('avatar-preview').innerHTML=`<img src="${reader.result}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;};reader.readAsDataURL(file);}}

document.getElementById('contact-form').addEventListener('submit',e=>{e.preventDefault();let c={id:editingId||Date.now().toString(),avatar:document.getElementById('avatar-preview').querySelector('img')?.src,name:document.getElementById('name').value,phone:document.getElementById('phone').value,email:document.getElementById('email').value,birthday:document.getElementById('birthday').value,group:document.getElementById('group').value,blood:document.getElementById('blood').value,emergency:document.getElementById('emergency').checked,private:document.getElementById('private').checked,notes:document.getElementById('notes').value,favorite:false,location:null};if(editingId){contacts=contacts.map(x=>x.id===editingId?c:x);}else{contacts.push(c);}localStorage.setItem('contacts',JSON.stringify(contacts));closeModal();renderAllContacts();renderFavorites();renderGroups();renderTrash();});

function editContact(id){editingId=id;openModal('edit');let c=contacts.find(x=>x.id===id);document.getElementById('name').value=c.name;document.getElementById('phone').value=c.phone;document.getElementById('email').value=c.email;document.getElementById('birthday').value=c.birthday;document.getElementById('group').value=c.group;document.getElementById('blood').value=c.blood;document.getElementById('emergency').checked=c.emergency;document.getElementById('private').checked=c.private;document.getElementById('notes').value=c.notes;if(c.avatar){document.getElementById('avatar-preview').innerHTML=`<img src="${c.avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;}}
function deleteContact(id){let c=contacts.find(x=>x.id===id);trash.push(c);contacts=contacts.filter(x=>x.id!==id);localStorage.setItem('contacts',JSON.stringify(contacts));localStorage.setItem('trash',JSON.stringify(trash));renderAllContacts();renderTrash();}
function deleteForever(id){trash=trash.filter(x=>x.id!==id);localStorage.setItem('trash',JSON.stringify(trash));renderTrash();}
function toggleFavorite(id){contacts=contacts.map(x=>x.id===id?{...x,favorite:!x.favorite}:x);localStorage.setItem('contacts',JSON.stringify(contacts));renderAllContacts();renderFavorites();}
function searchContacts(){let q=document.getElementById('search').value.toLowerCase();document.getElementById('contacts-grid-all').innerHTML=createContactHTML(contacts.filter(c=>c.name.toLowerCase().includes(q)||c.phone.includes(q)));}
function callContact(phone){if(!phone)return alert('No number');alert(`Calling ${phone}...`);callHistory.push({name:contacts.find(c=>c.phone===phone)?.name||'',phone,type:'Dialed',time:new Date().toLocaleString()});localStorage.setItem('callHistory',JSON.stringify(callHistory));renderCallHistory();}
function msgContact(phone){if(!phone)return alert('No number');window.open(`sms:${phone}`);}
function openLocation(loc){window.open(`https://www.google.com/maps?q=${loc}`);}

function toggleVoiceSearch(){if(!('webkitSpeechRecognition' in window)){alert('Browser does not support voice search');return;}recognition=new webkitSpeechRecognition();recognition.continuous=false;recognition.lang='en-US';recognition.onresult=e=>{document.getElementById('search').value=e.results[0][0].transcript;searchContacts();};recognition.start();}

// Live location
function trackLocation(id){navigator.geolocation.getCurrentPosition(pos=>{let c=contacts.find(x=>x.id===id);c.location=`${pos.coords.latitude},${pos.coords.longitude}`;localStorage.setItem('contacts',JSON.stringify(contacts));renderAllContacts();});}

</script>
</body>
</html>
