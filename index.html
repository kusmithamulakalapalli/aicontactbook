<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Hub 5.0</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  /* ---------- Global Styles ---------- */
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
  body{min-height:100vh;background:linear-gradient(135deg,#667eea,#764ba2);color:#333;overflow-x:hidden;}
  button{cursor:pointer;border:none;outline:none;}
  /* ---------- Splash ---------- */
  #splash{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#1a1a2e;z-index:1000;color:white;}
  #splash .title{font-size:4rem;color:#4ecdc4;text-shadow:0 0 20px #4ecdc4;animation:glow 2s infinite;}
  #splash .subtitle{font-size:1.2rem;margin-top:10px;color:#fff;}
  .enter-btn{margin-top:2rem;padding:15px 40px;font-size:1.2rem;border-radius:50px;background:linear-gradient(45deg,#ff6b6b,#4ecdc4);color:#fff;box-shadow:0 10px 30px rgba(255,107,107,0.4);animation:bounce 2s infinite;}
  .enter-btn:hover{transform:scale(1.05);box-shadow:0 15px 40px rgba(255,107,107,0.6);}
  @keyframes glow{0%,100%{text-shadow:0 0 20px #4ecdc4;}50%{text-shadow:0 0 40px #ff6b6b;}}
  @keyframes bounce{0%,20%,50%,80%,100%{transform:translateY(0);}40%{transform:translateY(-10px);}60%{transform:translateY(-5px);}}
  /* ---------- Login Page ---------- */
  #login-page{display:none;min-height:100vh;justify-content:center;align-items:center;padding:2rem;}
  .login-card{background:rgba(255,255,255,0.95);backdrop-filter:blur(20px);padding:3rem;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,0.3);width:100%;max-width:400px;text-align:center;}
  .login-card h2{color:#333;margin-bottom:2rem;font-size:2rem;}
  input{width:100%;padding:15px;margin:1rem 0;border:2px solid #eee;border-radius:10px;font-size:1rem;transition:border 0.3s;}
  input:focus{border-color:#667eea;box-shadow:0 0 0 3px rgba(102,126,234,0.1);}
  .login-btn{background:linear-gradient(45deg,#667eea,#764ba2);color:white;padding:15px;width:100%;border-radius:10px;font-size:1.1rem;font-weight:600;transition:transform 0.3s;}
  .login-btn:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(102,126,234,0.4);}
  /* ---------- App Header & Tabs ---------- */
  #app{display:none;min-height:100vh;}
  .header{padding:1rem 1.5rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap;background:rgba(255,255,255,0.95);backdrop-filter:blur(10px);box-shadow:0 2px 20px rgba(0,0,0,0.1);}
  .nav-tabs{display:flex;gap:0;background:rgba(102,126,234,0.2);border-radius:15px;padding:5px;margin-right:auto;}
  .tab-btn{background:transparent;padding:12px 20px;color:rgba(255,255,255,0.8);border-radius:12px;cursor:pointer;font-weight:500;display:flex;align-items:center;gap:6px;font-size:0.9rem;transition:all 0.3s;}
  .tab-btn.active{background:rgba(255,255,255,0.95);color:#333;box-shadow:0 5px 20px rgba(0,0,0,0.2);}
  .tab-btn:hover:not(.active){background:rgba(255,255,255,0.3);color:white;}
  .controls{display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap;}
  #search{padding:10px 20px;border:2px solid #667eea;border-radius:25px;background:white;min-width:200px;}
  #voice-btn{padding:10px;border:2px solid #667eea;border-radius:50%;width:45px;height:45px;display:flex;align-items:center;justify-content:center;background:white;}
  #voice-btn.active{background:#ff6b6b;color:white;border-color:#ff6b6b;}
  #add-contact,#restore-btn{padding:10px 16px;border-radius:25px;background:linear-gradient(45deg,#4ecdc4,#44a08d);color:white;font-weight:500;}
  /* ---------- Pages ---------- */
  .app-page{display:none;padding:2rem;min-height:calc(100vh - 120px);}
  .app-page.active{display:block;}
  .page-title{padding:1.5rem 0;border-bottom:2px solid rgba(255,255,255,0.1);margin-bottom:2rem;color:white;}
  .page-title h2{font-size:1.6rem;display:flex;align-items:center;gap:1rem;}
  /* ---------- Contact Card ---------- */
  .contacts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.5rem;max-width:1400px;margin:0 auto;}
  .contact-card{background:rgba(255,255,255,0.95);border-radius:20px;padding:1.5rem;box-shadow:0 10px 40px rgba(0,0,0,0.1);position:relative;transition:all 0.3s;}
  .contact-card:hover{transform:translateY(-5px);box-shadow:0 20px 60px rgba(0,0,0,0.2);}
  .contact-avatar{width:60px;height:60px;border-radius:50%;background:linear-gradient(45deg,#667eea,#764ba2);color:white;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:1.2rem;margin-bottom:1rem;overflow:hidden;}
  .contact-name{font-size:1.2rem;font-weight:bold;color:#333;margin-bottom:0.3rem;}
  .contact-phone,.contact-email,.contact-blood,.contact-group{color:#666;font-size:0.9rem;margin-bottom:0.3rem;}
  .contact-actions{display:flex;gap:0.5rem;margin-top:0.7rem;}
  .action-btn{padding:8px 12px;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:1rem;color:white;transition:all 0.2s;}
  .call-btn{background:#4ecdc4;}
  .msg-btn{background:#f9ca24;}
  .edit-btn{background:#667eea;}
  .delete-btn{background:#ff6b6b;}
  .fav-btn{position:absolute;top:15px;right:15px;background:none;font-size:1.5rem;cursor:pointer;color:#ffd700;}
  .fav-btn.active{color:#ff6b6b;animation:heartBeat 0.3s;}
  @keyframes heartBeat{0%,100%{transform:scale(1);}50%{transform:scale(1.2);}}
  /* ---------- Modal ---------- */
  #modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:1000;justify-content:center;align-items:center;}
  .modal-content{background:white;padding:2rem;border-radius:20px;width:90%;max-width:500px;max-height:80vh;overflow-y:auto;position:relative;}
  .close{position:absolute;top:20px;right:30px;font-size:2rem;cursor:pointer;color:#999;}
  select,textarea{width:100%;padding:12px;margin:0.5rem 0;border:2px solid #eee;border-radius:10px;}
  /* ---------- History ---------- */
  .history-card{background:rgba(255,255,255,0.9);border-radius:15px;padding:12px;margin-bottom:10px;box-shadow:0 5px 20px rgba(0,0,0,0.1);}
  /* ---------- Responsive ---------- */
  @media(max-width:768px){.contacts-grid{grid-template-columns:1fr;padding:1rem;}.header{flex-direction:column;gap:1rem;text-align:center;}.nav-tabs{order:3;width:100%;justify-content:center;}.controls{order:2;width:100%;justify-content:center;}}
</style>
</head>
<body>
<!-- Splash -->
<div id="splash">
  <div class="title">Contact Hub 5.0</div>
  <div class="subtitle">Your Smart Contact Manager</div>
  <button class="enter-btn" onclick="enterApp()"><i class="fas fa-arrow-right"></i> Enter</button>
</div>

<!-- Login -->
<div id="login-page">
  <div class="login-card">
    <h2><i class="fas fa-lock"></i> Welcome Back</h2>
    <input type="text" id="username" placeholder="Username" value="admin">
    <input type="password" id="password" placeholder="Password" value="123">
    <button class="login-btn" onclick="login()"><i class="fas fa-sign-in-alt"></i> Login</button>
  </div>
</div>

<!-- App -->
<div id="app">
  <div class="header">
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="showPage('all')"><i class="fas fa-address-book"></i> Contacts</button>
      <button class="tab-btn" onclick="showPage('favorites')"><i class="fas fa-heart"></i> Favorites</button>
      <button class="tab-btn" onclick="showPage('groups')"><i class="fas fa-users"></i> Groups</button>
      <button class="tab-btn" onclick="showPage('history')"><i class="fas fa-history"></i> History</button>
      <button class="tab-btn" onclick="showPage('trash')"><i class="fas fa-trash"></i> Trash</button>
    </div>
    <div class="controls">
      <input type="text" id="search" placeholder="🔍 Search contacts..." oninput="searchContacts()">
      <button id="voice-btn" onclick="toggleVoiceSearch()"><i class="fas fa-microphone"></i></button>
      <button id="add-contact" onclick="openModal('add')"><i class="fas fa-plus"></i> Add Contact</button>
      <button id="restore-btn" onclick="restoreAll()" title="Restore Deleted Contacts"><i class="fas fa-trash-restore"></i></button>
    </div>
  </div>

  <!-- Pages -->
  <div id="page-all" class="app-page active">
    <div class="page-title"><h2>All Contacts (<span id="all-count">0</span>)</h2></div>
    <div class="contacts-grid" id="contacts-grid-all"></div>
  </div>

  <div id="page-favorites" class="app-page">
    <div class="page-title"><h2>Favorites (<span id="fav-count">0</span>)</h2></div>
    <div class="contacts-grid" id="contacts-grid-fav"></div>
  </div>

  <div id="page-groups" class="app-page">
    <div class="page-title"><h2>Groups (<span id="group-count">0</span>)</h2></div>
    <div class="contacts-grid" id="groups-grid"></div>
  </div>

  <div id="page-history" class="app-page">
    <div class="page-title"><h2>Call & Message History (<span id="history-count">0</span>)</h2></div>
    <div id="history-grid"></div>
    <canvas id="chart" style="margin-top:20px;"></canvas>
  </div>

  <div id="page-trash" class="app-page">
    <div class="page-title"><h2>Trash</h2></div>
    <div class="contacts-grid" id="trash-grid"></div>
  </div>
</div>

<!-- Modal -->
<div id="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <h2 id="modal-title">Add Contact</h2>
    <form id="contact-form">
      <input type="file" id="avatar" accept="image/*" onchange="previewAvatar()">
      <div class="contact-avatar" id="avatar-preview">👤</div>
      <input type="text" id="name" placeholder="Name *" required>
      <input type="tel" id="phone" placeholder="Phone *">
      <input type="email" id="email" placeholder="Email">
      <input type="date" id="birthday" placeholder="Birthday">
      <input type="text" id="blood" placeholder="Blood Group">
      <input type="text" id="group" placeholder="Group">
      <textarea id="notes" placeholder="Notes"></textarea>
      <label><input type="checkbox" id="emergency"> Emergency Contact 🚨</label>
      <label><input type="checkbox" id="private"> Private 🔒</label>
      <button type="submit" class="login-btn" style="margin-top:1rem;">Save Contact</button>
    </form>
  </div>
</div>

<script>
/* ---------- Data ---------- */
let contacts=JSON.parse(localStorage.getItem('contacts'))||[];
let trash=JSON.parse(localStorage.getItem('trash'))||[];
let history=JSON.parse(localStorage.getItem('history'))||[];
let editingId=null;
let recognition=null;
let currentPage='all';

/* ---------- Splash/Login ---------- */
function enterApp(){document.getElementById('splash').style.display='none';document.getElementById('login-page').style.display='flex';}
function login(){document.getElementById('login-page').style.display='none';document.getElementById('app').style.display='block';renderAll();renderFavorites();renderGroups();renderHistory();renderTrash();}

/* ---------- Tab Navigation ---------- */
function showPage(page){currentPage=page;document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));event.target.classList.add('active');document.querySelectorAll('.app-page').forEach(p=>p.classList.remove('active'));document.getElementById(`page-${page}`).classList.add('active');if(page==='all')renderAll();if(page==='favorites')renderFavorites();if(page==='groups')renderGroups();if(page==='history')renderHistory();if(page==='trash')renderTrash();}

/* ---------- Render Functions ---------- */
function renderAll(){renderGrid('contacts-grid-all',contacts);document.getElementById('all-count').innerText=contacts.length;}
function renderFavorites(){renderGrid('contacts-grid-fav',contacts.filter(c=>c.favorite));document.getElementById('fav-count').innerText=contacts.filter(c=>c.favorite).length;}
function renderGroups(){let groups={};contacts.forEach(c=>{const g=c.group||'Uncategorized';if(!groups[g])groups[g]=[];groups[g].push(c);});const grid=document.getElementById('groups-grid');grid.innerHTML='';Object.entries(groups).forEach(([g,arr])=>{grid.innerHTML+=`<div class="contact-card" onclick="filterGroup('${g}')"><div class="contact-name">${g} (${arr.length})</div></div>`;});document.getElementById('group-count').innerText=Object.keys(groups).length;}
function renderTrash(){renderGrid('trash-grid',trash);}
function renderGrid(gridId,data){const grid=document.getElementById(gridId);grid.innerHTML='';data.forEach(c=>{grid.innerHTML+=`
  <div class="contact-card">
    <button class="fav-btn ${c.favorite?'active':''}" onclick="toggleFav(${c.id})">${c.favorite?'❤️':'🤍'}</button>
    <div class="contact-avatar">${c.avatar?`<img src="${c.avatar}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`:c.name[0]}</div>
    <div class="contact-name">${c.name}</div>
    <div class="contact-phone">${c.phone||''}</div>
    <div class="contact-email">${c.email||''}</div>
    <div class="contact-blood">${c.blood||''}</div>
    <div class="contact-group">${c.group||''}</div>
    <div class="contact-actions">
      <button class="action-btn call-btn" onclick="callContact(${c.id})"><i class="fas fa-phone"></i></button>
      <button class="action-btn msg-btn" onclick="msgContact(${c.id})"><i class="fas fa-comment"></i></button>
      <button class="action-btn edit-btn" onclick="editContact(${c.id})"><i class="fas fa-edit"></i></button>
      <button class="action-btn delete-btn" onclick="deleteContact(${c.id})"><i class="fas fa-trash"></i></button>
    </div>
  </div>
  `});}

/* ---------- Favorites ---------- */
function toggleFav(id){let c=contacts.find(c=>c.id===id);c.favorite=!c.favorite;saveContacts();renderFavorites();renderAll();}

/* ---------- Modal ---------- */
function openModal(mode,id=null){
  editingId=id;
  document.getElementById('modal-title').innerText=mode==='add'?'Add Contact':'Edit Contact';
  document.getElementById('modal').style.display='flex';
  if(mode==='edit' && id!==null){
    let c=contacts.find(c=>c.id===id);
    document.getElementById('name').value=c.name;
    document.getElementById('phone').value=c.phone;
    document.getElementById('email').value=c.email;
    document.getElementById('birthday').value=c.birthday;
    document.getElementById('blood').value=c.blood;
    document.getElementById('group').value=c.group;
    document.getElementById('notes').value=c.notes;
    document.getElementById('emergency').checked=c.emergency;
    document.getElementById('private').checked=c.private;
    document.getElementById('avatar-preview').innerHTML=c.avatar?`<img src="${c.avatar}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`:'👤';
  } else {document.getElementById('contact-form').reset();document.getElementById('avatar-preview').innerHTML='👤';}
}
function closeModal(){document.getElementById('modal').style.display='none';editingId=null;}
document.getElementById('contact-form').addEventListener('submit',function(e){e.preventDefault();saveContact();closeModal();});

/* ---------- Save Contact ---------- */
function saveContact(){
  const name=document.getElementById('name').value;
  if(!name)return alert('Name required');
  const contact={
    id:editingId||Date.now(),
    name,
    phone:document.getElementById('phone').value,
    email:document.getElementById('email').value,
    birthday:document.getElementById('birthday').value,
    blood:document.getElementById('blood').value,
    group:document.getElementById('group').value,
    notes:document.getElementById('notes').value,
    emergency:document.getElementById('emergency').checked,
    private:document.getElementById('private').checked,
    favorite:document.getElementById('emergency').checked,
    avatar:document.getElementById('avatar-preview').querySelector('img')?.src||''
  };
  if(editingId){
    let idx=contacts.findIndex(c=>c.id===editingId);
    contacts[idx]=contact;
  } else {contacts.push(contact);}
  saveContacts();renderAll();renderFavorites();renderGroups();renderTrash();
}

/* ---------- Save / Load ---------- */
function saveContacts(){localStorage.setItem('contacts',JSON.stringify(contacts));localStorage.setItem('trash',JSON.stringify(trash));}

/* ---------- Avatar Preview ---------- */
function previewAvatar(){const file=document.getElementById('avatar').files[0];if(file){const reader=new FileReader();reader.onload=()=>{document.getElementById('avatar-preview').innerHTML=`<img src="${reader.result}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;};reader.readAsDataURL(file);}}

/* ---------- Edit / Delete ---------- */
function editContact(id){openModal('edit',id);}
function deleteContact(id){let idx=contacts.findIndex(c=>c.id===id);trash.push(contacts[idx]);contacts.splice(idx,1);saveContacts();renderAll();renderFavorites();renderGroups();renderTrash();}

/* ---------- Restore ---------- */
function restoreAll(){contacts=[...contacts,...trash];trash=[];saveContacts();renderAll();renderFavorites();renderGroups();renderTrash();}

/* ---------- Call / Msg Simulation ---------- */
function callContact(id){let c=contacts.find(c=>c.id===id);alert('Calling '+c.name);let record={type:'Call',name:c.name,time:new Date().toLocaleString(),duration:Math.floor(Math.random()*30)+1};history.push(record);saveContacts();renderHistory();}
function msgContact(id){let c=contacts.find(c=>c.id===id);alert('Messaging '+c.name);let record={type:'Message',name:c.name,time:new Date().toLocaleString()};history.push(record);saveContacts();renderHistory();}

/* ---------- History ---------- */
function renderHistory(){const grid=document.getElementById('history-grid');grid.innerHTML='';history.slice().reverse().forEach(h=>{grid.innerHTML+=`<div class="history-card"><b>${h.type}</b> with ${h.name} at ${h.time}${h.duration?` (${h.duration} mins)`:""}</div>`;});document.getElementById('history-count').innerText=history.length;renderChart();}
function renderChart(){const ctx=document.getElementById('chart').getContext('2d');const calls=history.filter(h=>h.type==='Call').length;const msgs=history.filter(h=>h.type==='Message').length;new Chart(ctx,{type:'doughnut',data:{labels:['Calls','Messages'],datasets:[{data:[calls,msgs],backgroundColor:['#4ecdc4','#ff6b6b']}]},options:{responsive:true,plugins:{legend:{position:'bottom'}}}});}

/* ---------- Search ---------- */
function searchContacts(){let query=document.getElementById('search').value.toLowerCase();let filtered=contacts.filter(c=>c.name.toLowerCase().includes(query)||c.phone.includes(query)||c.email.includes(query));renderGrid('contacts-grid-all',filtered);}

/* ---------- Group Filter ---------- */
function filterGroup(g){let filtered=contacts.filter(c=>(c.group||'Uncategorized')===g);renderGrid('contacts-grid-all',filtered);showPage('all');}

/* ---------- Voice Search ---------- */
function toggleVoiceSearch(){
  if(!('webkitSpeechRecognition' in window)){return alert('Your browser does not support voice recognition');}
  if(!recognition){recognition=new webkitSpeechRecognition();recognition.continuous=false;recognition.interimResults=false;recognition.lang='en-US';recognition.onresult=e=>{document.getElementById('search').value=e.results[0][0].transcript;searchContacts();};recognition.onend=()=>{document.getElementById('voice-btn').classList.remove('active');recognition=null;};recognition.start();document.getElementById('voice-btn').classList.add('active');} 
  else{recognition.stop();document.getElementById('voice-btn').classList.remove('active');recognition=null;}
}
</script>
</body>
</html>
