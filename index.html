<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Hub 5.0</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>

<style>
/* ---------- GENERAL ---------- */
* {margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#b60e6d 0%,#764ba2 100%);color:#333;min-height:100vh;}
button, input, select, textarea {outline:none;}
a{text-decoration:none;color:inherit;}

/* ---------- SPLASH ---------- */
#splash{position:fixed;top:0;left:0;width:100%;height:100%;background:#1a1a2e;display:flex;flex-direction:column;justify-content:center;align-items:center;color:white;z-index:1000;}
#splash .title{font-size:4rem;color:#4ecdc4;text-shadow:0 0 20px #4ecdc4;animation:glow 2s infinite;margin-bottom:1rem;}
@keyframes glow{0%,100%{text-shadow:0 0 20px #4ecdc4;}50%{text-shadow:0 0 40px #ff6b6b;}}
.enter-btn{background:linear-gradient(45deg,#ff6b6b,#4ecdc4);color:white;border:none;padding:15px 40px;font-size:1.2rem;border-radius:50px;cursor:pointer;box-shadow:0 10px 30px rgba(255,107,107,0.4);transition:all 0.3s ease;animation:bounce 2s infinite;}
.enter-btn:hover{transform:scale(1.05);box-shadow:0 15px 40px rgba(255,107,107,0.6);}
@keyframes bounce{0%,20%,50%,80%,100%{transform:translateY(0);}40%{transform:translateY(-10px);}60%{transform:translateY(-5px);}}

/* ---------- LOGIN ---------- */
#login-page{display:none;min-height:100vh;justify-content:center;align-items:center;padding:2rem;}
.login-card{background:rgba(255,255,255,0.95);backdrop-filter:blur(20px);padding:3rem;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,0.3);width:100%;max-width:400px;text-align:center;}
.login-card h2{color:#333;margin-bottom:2rem;font-size:2rem;}
input{width:100%;padding:15px;margin:1rem 0;border:2px solid #eee;border-radius:10px;font-size:1rem;transition:border 0.3s;}
input:focus{border-color:#667eea;box-shadow:0 0 0 3px rgba(102,126,234,0.1);}
.login-btn{background:linear-gradient(45deg,#667eea,#764ba2);color:white;border:none;padding:15px;width:100%;border-radius:10px;font-size:1.1rem;cursor:pointer;transition:transform 0.3s;font-weight:600;}
.login-btn:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(102,126,234,0.4);}

/* ---------- HEADER ---------- */
#app{display:none;min-height:100vh;}
.header{padding:1rem 1.5rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap;background:rgba(255,255,255,0.95);backdrop-filter:blur(10px);box-shadow:0 2px 20px rgba(0,0,0,0.1);}
.nav-tabs{display:flex;gap:0;background:rgba(102,126,234,0.2);border-radius:15px;padding:5px;margin-right:auto;flex-wrap:wrap;}
.tab-btn{background:transparent;border:none;padding:10px 20px;color:rgba(255,255,255,0.8);border-radius:12px;cursor:pointer;font-weight:500;transition:all 0.3s;display:flex;align-items:center;gap:6px;font-size:0.9rem;}
.tab-btn.active{background:rgba(255,255,255,0.95);color:#333;box-shadow:0 5px 20px rgba(0,0,0,0.2);}
.tab-btn:hover:not(.active){background:rgba(255,255,255,0.3);color:white;}
.controls{display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap;}
#search{padding:10px 20px;border:2px solid #667eea;border-radius:25px;background:white;cursor:pointer;transition:all 0.3s;font-size:0.9rem;min-width:180px;}
#voice-btn{padding:10px;border:2px solid #667eea;border-radius:50%;background:white;cursor:pointer;transition:all 0.3s;width:45px;height:45px;display:flex;align-items:center;justify-content:center;}
#voice-btn.active{background:#ff6b6b;color:white;border-color:#ff6b6b;}
#add-contact{background:linear-gradient(45deg,#4ecdc4,#44a08d);color:white;border:none;padding:10px 16px;border-radius:25px;cursor:pointer;font-size:0.9rem;font-weight:500;transition:all 0.3s;}
#add-contact:hover{transform:scale(1.05);}
</style>
</head>

<body>

<!-- ========================== EXISTING CODE ========================== -->

<!-- SPLASH -->
<div id="splash">
  <div class="title">Contact Hub</div>
  <div class="subtitle">Your Smart Contact Manager</div>
  <button class="enter-btn" onclick="enterApp()"><i class="fas fa-arrow-right"></i> Enter</button>
</div>

<!-- LOGIN -->
<div id="login-page">
  <div class="login-card">
    <h2><i class="fas fa-lock"></i> Welcome Back</h2>

    <!-- 🔐 UPDATED INPUTS -->
    <input type="text" id="username" placeholder="Username (only alphabets, max 20)" maxlength="20">
    <input type="password" id="password" placeholder="Password (alphabets & numbers only)">

    <button class="login-btn" onclick="login()"><i class="fas fa-sign-in-alt"></i> Login</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="header">
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="showPage('all')"><i class="fas fa-address-book"></i> All Contacts</button>
      <button class="tab-btn" onclick="showPage('favorites')"><i class="fas fa-heart"></i> Favorites</button>
      <button class="tab-btn" onclick="showPage('groups')"><i class="fas fa-users"></i> Groups</button>
      <button class="tab-btn" onclick="showPrivate()"><i class="fas fa-lock"></i> Private Contacts</button>
      <button class="tab-btn" onclick="showPage('blocked')"><i class="fas fa-ban"></i> Blocked Contacts</button>
      <button class="tab-btn" onclick="showPage('emergency')"><i class="fas fa-ambulance"></i> Emergency Contacts</button>
      <button class="tab-btn" onclick="showPage('history')"><i class="fas fa-history"></i> History</button>
    </div>

    <div class="controls">
      <input type="text" id="search" placeholder="🔍 Search contacts..." oninput="searchContacts()">
      <button id="voice-btn" onclick="toggleVoiceSearch()"><i class="fas fa-microphone"></i></button>
      <button id="add-contact" onclick="openModal('add')"><i class="fas fa-plus"></i> Add Contact</button>
    </div>
  </div>

  <!-- ALL CONTACTS -->
  <div id="page-all" class="app-page active">
    <div class="page-title"><h2>All Contacts (<span id="all-count">0</span>)</h2></div>
    <div class="contacts-grid" id="contacts-grid-all"></div>
  </div>

  <!-- FAVORITES -->
  <div id="page-favorites" class="app-page">
    <div class="page-title"><h2>Favorites (<span id="fav-count">0</span>)</h2></div>
    <div class="contacts-grid" id="contacts-grid-fav"></div>
  </div>
</div>
<script>
/* ========================== ORIGINAL SCRIPT ========================== */
let contacts = [];
let history = [];
let privatePIN = "1234";
let activePage = "all";

/* ---------- SPLASH ---------- */
function enterApp(){
  document.getElementById('splash').style.display='none';
  document.getElementById('login-page').style.display='flex';
}

/* ---------- PRIVATE ---------- */
function showPrivate(){
  document.getElementById('private-modal').style.display='flex';
}
function closePrivateModal(){
  document.getElementById('private-modal').style.display='none';
}
function unlockPrivate(){
  let pin=document.getElementById('private-pin').value;
  if(pin===privatePIN){
    document.getElementById('private-modal').style.display='none';
    showPage('private');
  } else alert('Incorrect PIN');
}
function changePrivatePin(){
  privatePIN=prompt("Enter new PIN:");
  alert("PIN changed successfully");
}

/* ---------- VOICE SEARCH ---------- */
let recognition;
function toggleVoiceSearch(){
  const btn=document.getElementById('voice-btn');
  if(!('webkitSpeechRecognition' in window)){
    alert('Voice not supported');
    return;
  }
  if(!recognition){
    recognition=new webkitSpeechRecognition();
    recognition.continuous=false;
    recognition.lang='en-US';
    recognition.onresult=(e)=>{
      document.getElementById('search').value=e.results[0][0].transcript;
      searchContacts();
    };
  }
  btn.classList.toggle('active');
  btn.classList.contains('active') ? recognition.start() : recognition.stop();
}

/* ---------- CONTACTS ---------- */
function renderContacts(){
  const allGrid=document.getElementById('contacts-grid-all');
  const favGrid=document.getElementById('contacts-grid-fav');
  const privateGrid=document.getElementById('contacts-grid-private');

  allGrid.innerHTML='';
  favGrid.innerHTML='';
  privateGrid.innerHTML='';

  contacts.forEach(c=>{
    const card=document.createElement('div');
    card.className='contact-card';
    card.innerHTML=`
      <div class="contact-avatar">${c.name[0]}</div>
      <div class="contact-name">${c.name}</div>
      <div class="contact-phone">${c.phone}</div>
      <div class="contact-email">${c.email}</div>
      <div class="contact-blood">${c.blood}</div>
      <div class="contact-group">${c.group}</div>
      <div class="contact-actions">
        <button class="action-btn call-btn" onclick="callContact('${c.phone}')"><i class="fas fa-phone"></i></button>
        <button class="action-btn msg-btn" onclick="msgContact('${c.phone}')"><i class="fas fa-comment"></i></button>
        <button class="action-btn edit-btn" onclick="openModal('edit',${c.id})"><i class="fas fa-edit"></i></button>
        <button class="action-btn delete-btn" onclick="deleteContact(${c.id})"><i class="fas fa-trash"></i></button>
        <button class="action-btn location-btn" onclick="showLocation(${c.id})"><i class="fas fa-map-marker-alt"></i></button>
        <button class="action-btn" onclick="shareContact(${c.id})"><i class="fas fa-qrcode"></i></button>
      </div>
    `;
    allGrid.appendChild(card);
    if(c.favorite) favGrid.appendChild(card.cloneNode(true));
    if(c.private) privateGrid.appendChild(card.cloneNode(true));
  });
}

/* ---------- PAGE SWITCH ---------- */
function showPage(page){
  document.querySelectorAll('.app-page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+page).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector('.tab-btn[onclick*="'+page+'"]').classList.add('active');
  activePage=page;
}

/* ---------- SEARCH ---------- */
function searchContacts(){
  let term=document.getElementById('search').value.toLowerCase();
  document.querySelectorAll('.contact-card').forEach(c=>{
    c.style.display=c.innerText.toLowerCase().includes(term)?'block':'none';
  });
}

/* ---------- CALL / MESSAGE ---------- */
function callContact(phone){
  history.push({type:'Call',phone,time:new Date().toLocaleString()});
  updateHistory();
  window.location.href=`tel:${phone}`;
}
function msgContact(phone){
  history.push({type:'Message',phone,time:new Date().toLocaleString()});
  updateHistory();
  window.location.href=`sms:${phone}`;
}

/* ---------- HISTORY ---------- */
function updateHistory(){
  const grid=document.getElementById('history-grid');
  grid.innerHTML='';
  history.slice().reverse().forEach(h=>{
    const div=document.createElement('div');
    div.className='history-card';
    div.innerHTML=`<b>${h.type}</b> → ${h.phone}<br><small>${h.time}</small>`;
    grid.appendChild(div);
  });
  document.getElementById('history-count').innerText=history.length;
}

/* ---------- LOCATION ---------- */
function getCurrentLocation(){
  navigator.geolocation.getCurrentPosition(pos=>{
    document.getElementById('latitude').value=pos.coords.latitude;
    document.getElementById('longitude').value=pos.coords.longitude;
    alert('Location captured');
  });
}
function showLocation(id){
  const c=contacts.find(c=>c.id===id);
  document.getElementById('map-modal').style.display='flex';
  document.getElementById('map').innerHTML=
    `<iframe src="https://maps.google.com/maps?q=${c.latitude},${c.longitude}&z=15&output=embed"
     style="width:100%;height:100%;border:none;"></iframe>`;
}
function closeMap(){
  document.getElementById('map-modal').style.display='none';
}

/* ---------- QR CODE ---------- */
function shareContact(id){
  const c=contacts.find(c=>c.id===id);
  new QRious({
    element:document.getElementById('qr-code'),
    value:`Name:${c.name}\nPhone:${c.phone}\nEmail:${c.email}`,
    size:250
  });
  document.getElementById('qr-modal').style.display='flex';
}
function closeQR(){
  document.getElementById('qr-modal').style.display='none';
}

/* ---------- FORM ---------- */
document.getElementById('contact-form').addEventListener('submit',function(e){
  e.preventDefault();
  contacts.push({
    id:Date.now(),
    name:name.value,
    phone:phone.value,
    email:email.value,
    blood:blood.value,
    group:group.value,
    notes:notes.value,
    latitude:latitude.value,
    longitude:longitude.value,
    favorite:false,
    private:document.getElementById('private').checked,
    emergency:document.getElementById('emergency').checked
  });
  closeModal();
  renderContacts();
});

function deleteContact(id){
  contacts=contacts.filter(c=>c.id!==id);
  renderContacts();
}
</script>
</body>
</html>
