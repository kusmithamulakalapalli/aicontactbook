<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contact Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI",sans-serif;}
body{background:#0f172a;color:#fff;min-height:100vh;transition:0.3s;}
.hidden{display:none}

/* ---------- LANDING ---------- */
#landing{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    background:linear-gradient(135deg,#6366f1,#9333ea);
}
#landing h1{font-size:3rem}
#landing p{max-width:500px;margin:15px}
#landing button{
    padding:15px 40px;
    border:none;
    border-radius:30px;
    font-size:1.1rem;
    background:#fff;
    color:#4f46e5;
    cursor:pointer;
}

/* ---------- LOGIN ---------- */
#login{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}
.login-box{
    background:#020617;
    padding:30px;
    width:350px;
    border-radius:12px;
}
.login-box h2{text-align:center;margin-bottom:15px}
.login-box input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:8px;
    border:none;
}
.login-box button{
    width:100%;
    padding:12px;
    background:#6366f1;
    border:none;
    color:#fff;
    border-radius:8px;
}

/* ---------- APP ---------- */
header{
    background:#020617;
    padding:15px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}
header button{
    padding:6px 12px;
    border-radius:6px;
    border:none;
    cursor:pointer;
}

nav{
    display:flex;
    background:#020617;
}
nav button{
    flex:1;
    padding:12px;
    border:none;
    background:none;
    color:#cbd5f5;
}
nav button.active{
    background:#6366f1;
    color:#fff;
}

.page{display:none;padding:20px}
.page.active{display:block}

/* ---------- CARDS ---------- */
.card{
    background:#020617;
    padding:15px;
    border-radius:10px;
    margin-bottom:10px;
}
.contact{
    display:flex;
    justify-content:space-between;
    align-items:center;
}
.contact small{opacity:0.7}

/* ---------- FORM ---------- */
form input, form select{
    width:100%;
    padding:10px;
    margin:6px 0;
    border-radius:6px;
    border:none;
}

/* ---------- DARK/LIGHT ---------- */
.light{
    background:#f1f5f9;
    color:#020617;
}
.light header,.light nav,.light .card,.light .login-box{
    background:#fff;
    color:#020617;
}
.light nav button{color:#020617}
.light nav button.active{background:#6366f1;color:#fff}
</style>
</head>

<body>

<!-- LANDING -->
<section id="landing">
<h1>📞 Contact Hub</h1>
<p>All your contacts, calls, history & stats in one modern hub</p>
<button onclick="goLogin()">Get Started</button>
</section>

<!-- LOGIN -->
<section id="login" class="hidden">
<div class="login-box">
<h2>Login</h2>
<input placeholder="Username">
<input type="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>
</section>

<!-- APP -->
<section id="app" class="hidden">

<header>
<h3>Contact Hub</h3>
<div>
<button onclick="toggleTheme()">🌙</button>
<button onclick="logout()">Logout</button>
</div>
</header>

<nav>
<button class="active" onclick="showPage('contacts',this)">Contacts</button>
<button onclick="showPage('history',this)">History</button>
<button onclick="showPage('stats',this)">Stats</button>
<button onclick="showPage('add',this)">Add</button>
</nav>

<!-- CONTACTS -->
<div id="contacts" class="page active"></div>

<!-- HISTORY -->
<div id="history" class="page"></div>

<!-- STATS -->
<div id="stats" class="page"></div>

<!-- ADD CONTACT -->
<div id="add" class="page">
<form onsubmit="addContact(event)">
<input id="name" placeholder="Name" required>
<input id="phone" placeholder="Phone" required>
<input id="blood" placeholder="Blood Group">
<input id="birthday" type="date">
<select id="group">
<option>Family</option>
<option>Friends</option>
<option>Work</option>
</select>
<button type="submit">Save Contact</button>
</form>
</div>

</section>

<script>
let contacts = JSON.parse(localStorage.getItem("contacts")) || [];
let calls = JSON.parse(localStorage.getItem("calls")) || [];
let dark=true;

/* ---------- NAV ---------- */
function showPage(id,btn){
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
document.getElementById(id).classList.add("active");
document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
}

/* ---------- FLOW ---------- */
function goLogin(){landing.classList.add("hidden");login.classList.remove("hidden")}
function login(){login.classList.add("hidden");app.classList.remove("hidden");render()}
function logout(){app.classList.add("hidden");landing.classList.remove("hidden")}

/* ---------- THEME ---------- */
function toggleTheme(){
dark=!dark;
document.body.classList.toggle("light",!dark);
}

/* ---------- CONTACTS ---------- */
function addContact(e){
e.preventDefault();
contacts.push({
id:Date.now(),
name:name.value,
phone:phone.value,
blood:blood.value,
birthday:birthday.value,
group:group.value
});
localStorage.setItem("contacts",JSON.stringify(contacts));
e.target.reset();
render();
alert("Contact Added!");
}

function render(){
renderContacts();
renderHistory();
renderStats();
}

function renderContacts(){
contactsDiv=document.getElementById("contacts");
contactsDiv.innerHTML="";
contacts.forEach(c=>{
let div=document.createElement("div");
div.className="card contact";
div.innerHTML=`
<div>
<b>${c.name}</b><br>
<small>📞 ${c.phone} | 🩸 ${c.blood || "N/A"}</small>
</div>
<div>
<button onclick="call('${c.name}')">📞</button>
<button onclick="locate('${c.name}')">📍</button>
</div>`;
contactsDiv.appendChild(div);
});
}

/* ---------- CALL ---------- */
function call(name){
let dur=Math.floor(Math.random()*10)+1;
calls.push({name,dur,date:new Date().toLocaleString()});
localStorage.setItem("calls",JSON.stringify(calls));
alert(`Calling ${name} (${dur} mins)`);
render();
}

/* ---------- LOCATION ---------- */
function locate(name){
navigator.geolocation.getCurrentPosition(pos=>{
alert(`${name} location:\nLat:${pos.coords.latitude}\nLng:${pos.coords.longitude}`);
});
}

/* ---------- HISTORY ---------- */
function renderHistory(){
history.innerHTML="";
calls.forEach(c=>{
history.innerHTML+=`<div class="card">${c.name} – ${c.dur} mins – ${c.date}</div>`;
});
}

/* ---------- STATS ---------- */
function renderStats(){
let total=calls.reduce((s,c)=>s+c.dur,0);
stats.innerHTML=`
<div class="card">Total Calls: ${calls.length}</div>
<div class="card">Total Duration: ${total} mins</div>`;
}

/* ---------- VOICE SEARCH ---------- */
window.addEventListener("keydown",e=>{
if(e.key==="v"){
let rec=new webkitSpeechRecognition();
rec.start();
rec.onresult=ev=>{
let q=ev.results[0][0].transcript.toLowerCase();
document.getElementById("contacts").querySelectorAll(".card").forEach(c=>{
c.style.display=c.innerText.toLowerCase().includes(q)?"block":"none";
});
}
}
});
</script>

</body>
</html>
