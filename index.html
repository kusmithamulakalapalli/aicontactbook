<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Hub 4.0</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#b60e6d 0%,#764ba2 100%);min-height:100vh;color:#333;}

    /* Splash */
    #splash{position:fixed;top:0;left:0;width:100%;height:100%;background:#1a1a2e;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:1000;color:white;}
    .title{font-size:4rem;color:#4ecdc4;text-shadow:0 0 20px #4ecdc4;animation:glow 2s infinite;margin-bottom:1rem;}
    @keyframes glow{0%,100%{text-shadow:0 0 20px #4ecdc4;}50%{text-shadow:0 0 40px #ff6b6b;}}
    .enter-btn{background:linear-gradient(45deg,#ff6b6b,#4ecdc4);color:white;border:none;padding:15px 40px;font-size:1.2rem;border-radius:50px;cursor:pointer;margin-top:2rem;box-shadow:0 10px 30px rgba(255,107,107,0.4);transition:all 0.3s ease;animation:bounce 2s infinite;}
    .enter-btn:hover{transform:scale(1.05);box-shadow:0 15px 40px rgba(255,107,107,0.6);}
    @keyframes bounce{0%,20%,50%,80%,100%{transform:translateY(0);}40%{transform:translateY(-10px);}60%{transform:translateY(-5px);}}

    /* Login */
    #login-page{display:none;min-height:100vh;justify-content:center;align-items:center;padding:2rem;}
    .login-card{background:rgba(255,255,255,0.95);backdrop-filter:blur(20px);padding:3rem;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,0.3);width:100%;max-width:400px;text-align:center;}
    .login-card h2{color:#333;margin-bottom:2rem;font-size:2rem;}
    input{width:100%;padding:15px;margin:1rem 0;border:2px solid #eee;border-radius:10px;font-size:1rem;transition:border 0.3s;}
    input:focus{outline:none;border-color:#667eea;box-shadow:0 0 0 3px rgba(102,126,234,0.1);}
    .login-btn{background:linear-gradient(45deg,#667eea,#764ba2);color:white;border:none;padding:15px;width:100%;border-radius:10px;font-size:1.1rem;cursor:pointer;transition:transform 0.3s;font-weight:600;}
    .login-btn:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(102,126,234,0.4);}

    /* App */
    #app{display:none;min-height:100vh;}
    .header{padding:1rem 2rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap;background:rgba(255,255,255,0.95);backdrop-filter:blur(10px);box-shadow:0 2px 20px rgba(0,0,0,0.1);}
    .nav-tabs{display:flex;gap:0;background:rgba(102,126,234,0.2);border-radius:15px;padding:5px;margin-right:auto;}
    .tab-btn{background:transparent;border:none;padding:12px 24px;color:rgba(255,255,255,0.8);border-radius:12px;cursor:pointer;font-weight:500;transition:all 0.3s;font-size:0.95rem;display:flex;align-items:center;gap:8px;}
    .tab-btn.active{background:rgba(255,255,255,0.95);color:#333;box-shadow:0 5px 20px rgba(0,0,0,0.2);}
    .tab-btn:hover:not(.active){background:rgba(255,255,255,0.3);color:white;}
    .controls{display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap;}
    #search{padding:10px 20px;border:2px solid #667eea;border-radius:25px;background:white;cursor:pointer;transition:all 0.3s;font-size:0.9rem;min-width:200px;}
    #voice-btn{padding:10px;border:2px solid #667eea;border-radius:50%;background:white;cursor:pointer;transition:all 0.3s;width:45px;height:45px;display:flex;align-items:center;justify-content:center;}
    #voice-btn.active{background:#ff6b6b;color:white;border-color:#ff6b6b;}
    #add-contact, .clear-btn{background:linear-gradient(45deg,#4ecdc4,#44a08d);color:white;border:none;padding:10px 16px;border-radius:25px;cursor:pointer;font-size:0.9rem;font-weight:500;transition:all 0.3s;}
    .clear-btn{background:linear-gradient(45deg,#6c5ce7,#a29bfe)!important;}
    .storage-info{background:rgba(0,0,0,0.2);padding:8px 12px;border-radius:20px;color:white;font-size:0.8rem;font-family:monospace;white-space:nowrap;}

    /* Pages */
    .app-page{display:none;padding:2rem;min-height:calc(100vh - 140px);background:rgba(255,255,255,0.05);}
    .app-page.active{display:block;}
    .page-title{padding:1.5rem 0;border-bottom:2px solid rgba(255,255,255,0.1);margin-bottom:2rem;color:white;}
    .page-title h2{font-size:1.8rem;display:flex;align-items:center;gap:1rem;}

    /* Contacts */
    .contacts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:2rem;max-width:1400px;margin:0 auto;}
    .contact-card{background:rgba(255,255,255,0.95);border-radius:20px;padding:1.5rem;box-shadow:0 10px 40px rgba(0,0,0,0.1);transition:transform 0.3s,box-shadow 0.3s;position:relative;overflow:hidden;}
    .contact-card:hover{transform:translateY(-5px);box-shadow:0 20px 60px rgba(0,0,0,0.2);}
    .contact-avatar{width:60px;height:60px;border-radius:50%;background:linear-gradient(45deg,#667eea,#764ba2);color:white;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:1.2rem;margin-bottom:1rem;}
    .contact-name{font-size:1.4rem;font-weight:bold;color:#333;margin-bottom:0.5rem;}
    .contact-phone{color:#666;font-size:1rem;margin-bottom:0.5rem;}
    .contact-actions{display:flex;gap:0.5rem;margin-top:1rem;}
    .action-btn{padding:8px 12px;border:none;border-radius:50%;cursor:pointer;font-size:1rem;transition:transform 0.2s;width:40px;height:40px;display:flex;align-items:center;justify-content:center;}
    .call-btn{background:#4ecdc4;color:white;}
    .msg-btn{background:#f9ca24;color:white;}
    .edit-btn{background:#667eea;color:white;}
    .delete-btn{background:#ff6b6b;color:white;}
    .fav-btn{position:absolute;top:15px;right:15px;background:none;border:none;font-size:1.5rem;cursor:pointer;color:#ffd700;}
    .fav-btn.active{color:#ff6b6b;animation:heartBeat 0.3s;}
    @keyframes heartBeat{0%,100%{transform:scale(1);}50%{transform:scale(1.2);}}

    /* Call History Page */
    .history-grid{display:grid;grid-template-columns:1fr;gap:1rem;max-width:800px;margin:0 auto;}
    .history-card{background:white;padding:1rem;border-radius:15px;box-shadow:0 5px 20px rgba(0,0,0,0.1);display:flex;justify-content:space-between;align-items:center;}
</style>
</head>
<body>
<!-- Splash -->
<div id="splash">
    <div class="title">Contact Hub 4.0</div>
    <button class="enter-btn" onclick="enterApp()"><i class="fas fa-arrow-right"></i> Enter</button>
</div>

<!-- Login -->
<div id="login-page">
    <div class="login-card">
        <h2><i class="fas fa-lock"></i> Welcome Back</h2>
        <input type="text" id="username" placeholder="Username" value="admin">
        <input type="password" id="password" placeholder="Password" value="123">
        <button class="login-btn" onclick="login()"><i class="fas fa-sign-in-alt"></i> Login</button>
    </div>
</div>

<!-- App -->
<div id="app">
    <div class="header">
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="showPage('all')"><i class="fas fa-address-book"></i> All Contacts</button>
            <button class="tab-btn" onclick="showPage('favorites')"><i class="fas fa-heart"></i> Favorites</button>
            <button class="tab-btn" onclick="showPage('groups')"><i class="fas fa-users"></i> Groups</button>
            <button class="tab-btn" onclick="showPage('history')"><i class="fas fa-history"></i> Call History</button>
        </div>
        <div class="controls">
            <input type="text" id="search" placeholder="🔍 Search contacts..." oninput="searchContacts()">
            <button id="add-contact" onclick="openModal('add')"><i class="fas fa-plus"></i> Add Contact</button>
        </div>
    </div>

    <!-- All Contacts Page -->
    <div id="page-all" class="app-page active">
        <div class="page-title"><h2>All Contacts (<span id="all-count">0</span>)</h2></div>
        <div class="contacts-grid" id="contacts-grid-all"></div>
    </div>

    <!-- Favorites Page -->
    <div id="page-favorites" class="app-page">
        <div class="page-title"><h2>Favorites (<span id="fav-count">0</span>)</h2></div>
        <div class="contacts-grid" id="contacts-grid-fav"></div>
    </div>

    <!-- Groups Page -->
    <div id="page-groups" class="app-page">
        <div class="page-title"><h2>All Groups (<span id="group-count">0</span>)</h2></div>
        <div class="groups-grid" id="groups-grid"></div>
    </div>

    <!-- Call History Page -->
    <div id="page-history" class="app-page">
        <div class="page-title"><h2>Call / Message History (<span id="history-count">0</span>)</h2></div>
        <div class="history-grid" id="history-grid"></div>
    </div>
</div>

<!-- Modal -->
<div id="modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);justify-content:center;align-items:center;z-index:1000;">
    <div style="background:white;padding:2rem;border-radius:20px;width:90%;max-width:500px;max-height:80vh;overflow-y:auto;position:relative;">
        <span style="position:absolute;top:20px;right:30px;font-size:2rem;cursor:pointer;color:#999;" onclick="closeModal()">&times;</span>
        <h2 id="modal-title">Add Contact</h2>
        <form id="contact-form">
            <input type="file" id="avatar" accept="image/*" onchange="previewAvatar()">
            <div class="contact-avatar" id="avatar-preview">👤</div>
            <input type="text" id="name" placeholder="Name *" required>
            <input type="tel" id="phone" placeholder="Phone *">
            <input type="email" id="email" placeholder="Email">
            <input type="date" id="birthday" placeholder="Birthday">
            <input type="text" id="blood" placeholder="Blood Group">
            <input type="text" id="follow-up" placeholder="Follow Up">
            <input type="text" id="group" placeholder="Group">
            <textarea id="notes" placeholder="Notes"></textarea>
            <label><input type="checkbox" id="emergency"> Emergency Contact</label>
            <label><input type="checkbox" id="private"> Private Contact</label>
            <button type="submit" class="login-btn" style="margin-top:1rem;">Save Contact</button>
        </form>
    </div>
</div>

<script>
let contacts = JSON.parse(localStorage.getItem('contacts'))||[];
let history = JSON.parse(localStorage.getItem('history'))||[];
let editingId = null;
let currentPage='all';

function enterApp(){document.getElementById('splash').style.display='none';document.getElementById('login-page').style.display='flex';}
function login(){document.getElementById('login-page').style.display='none';document.getElementById('app').style.display='block';renderContacts();renderHistory();}

function showPage(page){
    currentPage=page;
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelector(`.tab-btn[onclick="showPage('${page}')"]`).classList.add('active');
    document.querySelectorAll('.app-page').forEach(p=>p.classList.remove('active'));
    document.getElementById(`page-${page}`).classList.add('active');
    renderContacts();
    if(page==='history') renderHistory();
}

function renderContacts(){
    const gridAll=document.getElementById('contacts-grid-all');
    const gridFav=document.getElementById('contacts-grid-fav');
    const gridGroups=document.getElementById('groups-grid');

    let filtered = contacts.filter(c=>!c.private||currentPage==='all');
    document.getElementById('all-count').innerText=filtered.length;
    gridAll.innerHTML='';gridFav.innerHTML='';gridGroups.innerHTML='';

    filtered.forEach(c=>{
        const favClass=c.favorite?'active':'';
        const card=`<div class="contact-card">
            <button class="fav-btn ${favClass}" onclick="toggleFav(${c.id})"><i class="fas fa-heart"></i></button>
            <div class="contact-avatar">${c.avatar?`<img src="${c.avatar}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`:c.name[0]}</div>
            <div class="contact-name">${c.name}</div>
            <div class="contact-phone">${c.phone||'-'}</div>
            <div>${c.group||'Uncategorized'}</div>
            <div class="contact-actions">
                <button class="action-btn call-btn" onclick="callContact(${c.id})"><i class="fas fa-phone"></i></button>
                <button class="action-btn msg-btn" onclick="msgContact(${c.id})"><i class="fas fa-comment-dots"></i></button>
                <button class="action-btn edit-btn" onclick="editContact(${c.id})"><i class="fas fa-edit"></i></button>
                <button class="action-btn delete-btn" onclick="deleteContact(${c.id})"><i class="fas fa-trash"></i></button>
            </div>
        </div>`;
        gridAll.innerHTML+=card;
        if(c.favorite) gridFav.innerHTML+=card;
    });

    // Groups
    const groupNames=[...new Set(filtered.map(c=>c.group).filter(Boolean))];
    groupNames.forEach(g=>{
        const groupContacts=filtered.filter(c=>c.group===g);
        const color="#"+Math.floor(Math.random()*16777215).toString(16);
        gridGroups.innerHTML+=`<div class="group-card" style="border-top:8px solid ${color}">
            <div class="group-name">${g}</div>
            <div class="group-count">${groupContacts.length} contacts</div>
            <div class="group-contacts">${groupContacts.map(c=>`<div class="group-avatar">${c.name[0]}</div>`).join('')}</div>
        </div>`;
    });
}

function openModal(type){
    editingId=null;
    document.getElementById('modal').style.display='flex';
    document.getElementById('modal-title').innerText=type==='add'?'Add Contact':'Edit Contact';
    document.getElementById('contact-form').reset();
    document.getElementById('avatar-preview').innerText='👤';
}

function closeModal(){document.getElementById('modal').style.display='none';}

document.getElementById('contact-form').onsubmit=function(e){
    e.preventDefault();
    const id=editingId||Date.now();
    const newContact={
        id:id,
        name:document.getElementById('name').value,
        phone:document.getElementById('phone').value,
        email:document.getElementById('email').value,
        birthday:document.getElementById('birthday').value,
        blood:document.getElementById('blood').value,
        followUp:document.getElementById('follow-up').value,
        group:document.getElementById('group').value,
        notes:document.getElementById('notes').value,
        emergency:document.getElementById('emergency').checked,
        private:document.getElementById('private').checked,
        favorite:false,
        avatar:document.getElementById('avatar-preview').dataset.img||''
    };
    if(editingId){
        contacts=contacts.map(c=>c.id===editingId?newContact:c);
    }else{
        contacts.push(newContact);
    }
    localStorage.setItem('contacts',JSON.stringify(contacts));
    closeModal();
    renderContacts();
}

function previewAvatar(){
    const file=document.getElementById('avatar').files[0];
    const reader=new FileReader();
    reader.onload=function(){document.getElementById('avatar-preview').dataset.img=reader.result;document.getElementById('avatar-preview').innerHTML=`<img src="${reader.result}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;}
    reader.readAsDataURL(file);
}

function toggleFav(id){
    contacts=contacts.map(c=>c.id===id?{...c,favorite:!c.favorite}:c);
    localStorage.setItem('contacts',JSON.stringify(contacts));
    renderContacts();
}

function editContact(id){
    editingId=id;
    const c=contacts.find(c=>c.id===id);
    document.getElementById('name').value=c.name;
    document.getElementById('phone').value=c.phone;
    document.getElementById('email').value=c.email;
    document.getElementById('birthday').value=c.birthday;
    document.getElementById('blood').value=c.blood;
    document.getElementById('follow-up').value=c.followUp;
    document.getElementById('group').value=c.group;
    document.getElementById('notes').value=c.notes;
    document.getElementById('emergency').checked=c.emergency;
    document.getElementById('private').checked=c.private;
    if(c.avatar){document.getElementById('avatar-preview').dataset.img=c.avatar;document.getElementById('avatar-preview').innerHTML=`<img src="${c.avatar}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;}
    openModal('edit');
}

function deleteContact(id){
    if(confirm('Delete contact?')){
        contacts=contacts.filter(c=>c.id!==id);
        localStorage.setItem('contacts',JSON.stringify(contacts));
        renderContacts();
    }
}

function searchContacts(){
    const query=document.getElementById('search').value.toLowerCase();
    document.querySelectorAll('.contact-card').forEach(c=>{
        const name=c.querySelector('.contact-name').innerText.toLowerCase();
        c.style.display=name.includes(query)?'block':'none';
    });
}

// Call & Message Simulation
function callContact(id){
    const c=contacts.find(c=>c.id===id);
    const duration=Math.floor(Math.random()*10)+1; // simulated duration in minutes
    alert(`Calling ${c.name}... Duration: ${duration} min`);
    history.unshift({id:Date.now(),contact:c.name,type:'Call',duration,durationText:duration+' min',time:new Date().toLocaleString()});
    localStorage.setItem('history',JSON.stringify(history));
    renderHistory();
}

function msgContact(id){
    const c=contacts.find(c=>c.id===id);
    const msg=prompt(`Send message to ${c.name}:`);
    if(msg){history.unshift({id:Date.now(),contact:c.name,type:'Message',msg,time:new Date().toLocaleString()});localStorage.setItem('history',JSON.stringify(history));renderHistory();}
}

function renderHistory(){
    const grid=document.getElementById('history-grid');
    grid.innerHTML='';
    history.forEach(h=>{
        const card=`<div class="history-card">
            <div><strong>${h.contact}</strong> - ${h.type}</div>
            <div>${h.durationText||''}${h.msg?': '+h.msg:''}</div>
            <div>${h.time}</div>
        </div>`;
        grid.innerHTML+=card;
    });
    document.getElementById('history-count').innerText=history.length;
}
</script>
</body>
</html>
