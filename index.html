<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Hub - Full Project</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Segoe UI,sans-serif;
background:linear-gradient(135deg,#b60e6d,#764ba2);
min-height:100vh;color:#333}

/* Splash */
#splash{
position:fixed;inset:0;
background:#0f0f2d;
display:flex;flex-direction:column;
align-items:center;justify-content:center;
color:white;z-index:999}
.title{font-size:4rem;color:#4ecdc4;
text-shadow:0 0 30px #4ecdc4}
.enter-btn{
margin-top:2rem;
padding:15px 40px;
border:none;border-radius:40px;
font-size:1.2rem;
background:linear-gradient(45deg,#ff6b6b,#4ecdc4);
color:white;cursor:pointer}

/* Login */
#login-page{display:none;min-height:100vh;
align-items:center;justify-content:center}
.login-card{
background:white;padding:2rem;
border-radius:20px;
width:350px;text-align:center}
input,select,textarea{
width:100%;padding:12px;margin:10px 0;
border-radius:10px;border:1px solid #ccc}
.login-btn{
background:#667eea;color:white;
border:none;padding:12px;
border-radius:10px;cursor:pointer}

/* App */
#app{display:none}
.header{
background:white;padding:1rem;
display:flex;gap:1rem;flex-wrap:wrap}
.tab-btn{
padding:10px 20px;border:none;
border-radius:20px;
cursor:pointer}
.tab-btn.active{background:#667eea;color:white}
.controls{margin-left:auto;display:flex;gap:.5rem}
.app-page{display:none;padding:1.5rem}
.app-page.active{display:block}

/* Cards */
.contacts-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
gap:1rem}
.contact-card{
background:white;
padding:1rem;border-radius:20px;
position:relative}
.fav-btn{
position:absolute;top:10px;right:10px;
border:none;background:none;font-size:1.5rem}
.group-tag{
background:#667eea;color:white;
display:inline-block;
padding:4px 10px;
border-radius:20px;font-size:.8rem}
.action-btn{
border:none;border-radius:50%;
width:40px;height:40px;
cursor:pointer;color:white}
.call-btn{background:#4ecdc4}
.msg-btn{background:#f9ca24}
.edit-btn{background:#667eea}
.delete-btn{background:#ff6b6b}

/* Modal */
#modal{
display:none;position:fixed;inset:0;
background:rgba(0,0,0,.7);
justify-content:center;align-items:center}
.modal-content{
background:white;padding:2rem;
border-radius:20px;width:400px}
.close{float:right;font-size:1.5rem;cursor:pointer}
</style>
</head>

<body>

<!-- Splash -->
<div id="splash">
<div class="title">Contact Hub</div>
<p>Your Smart Contact Manager</p>
<button class="enter-btn" onclick="enterApp()">Enter</button>
</div>

<!-- Login -->
<div id="login-page">
<div class="login-card">
<h2>Login</h2>
<input value="admin">
<input type="password" value="123">
<button class="login-btn" onclick="login()">Login</button>
</div>
</div>

<!-- App -->
<div id="app">
<div class="header">
<button class="tab-btn active" onclick="showPage('all')">All</button>
<button class="tab-btn" onclick="showPage('fav')">Favorites</button>
<button class="tab-btn" onclick="showPage('groups')">Groups</button>
<button class="tab-btn" onclick="showPage('history')">Call History</button>

<div class="controls">
<input id="search" placeholder="Search..." oninput="searchContacts()">
<button onclick="openModal()">+ Add</button>
</div>
</div>

<div id="page-all" class="app-page active">
<div class="contacts-grid" id="all-grid"></div>
</div>

<div id="page-fav" class="app-page">
<div class="contacts-grid" id="fav-grid"></div>
</div>

<div id="page-groups" class="app-page">
<div class="contacts-grid" id="group-grid"></div>
</div>

<div id="page-history" class="app-page">
<div class="contacts-grid" id="history-grid"></div>
</div>
</div>

<!-- Modal -->
<div id="modal">
<div class="modal-content">
<span class="close" onclick="closeModal()">&times;</span>
<form onsubmit="saveContact(event)">
<input id="name" placeholder="Name" required>
<input id="phone" placeholder="Phone">
<select id="blood">
<option value="">Blood Group</option>
<option>A+</option><option>B+</option><option>O+</option><option>AB+</option>
<option>A-</option><option>B-</option><option>O-</option><option>AB-</option>
</select>
<input id="group" placeholder="Group">
<button class="login-btn">Save</button>
</form>
</div>
</div>

<script>
let contacts=JSON.parse(localStorage.getItem("contacts"))||[];
let callHistory=JSON.parse(localStorage.getItem("history"))||[];
let editId=null;

/* Navigation */
function enterApp(){
splash.style.display="none";
login-page.style.display="flex"}
function login(){
login-page.style.display="none";
app.style.display="block";
renderAll()}
function showPage(p){
document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
event.target.classList.add("active");
document.querySelectorAll(".app-page").forEach(p=>p.classList.remove("active"));
document.getElementById("page-"+p).classList.add("active");
if(p==="fav")renderFav();
if(p==="groups")renderGroups();
if(p==="history")renderHistory();}

/* Render */
function renderAll(list=contacts){
all-grid.innerHTML=list.map(card).join("")}
function renderFav(){
fav-grid.innerHTML=contacts.filter(c=>c.fav).map(card).join("")}
function renderGroups(){
let g={};
contacts.forEach(c=>{g[c.group||"Other"]=g[c.group||"Other"]||[];g[c.group||"Other"].push(c)})
group-grid.innerHTML=Object.entries(g).map(([k,v])=>`
<div class="contact-card">
<b>${k}</b><br>${v.length} contacts
</div>`).join("")}
function renderHistory(){
history-grid.innerHTML=callHistory.map(h=>`
<div class="contact-card">
<b>${h.name}</b><br>${h.phone}<br>
<span class="group-tag">${h.time}</span>
</div>`).join("")}

/* Card */
function card(c){
return`
<div class="contact-card">
<button class="fav-btn" onclick="fav(${c.id})">${c.fav?"❤️":"🤍"}</button>
<b>${c.name}</b><br>${c.phone}<br>
${c.blood?`<span class="group-tag">🩸${c.blood}</span>`:""}
<div>
<button class="action-btn call-btn" onclick="call('${c.phone}','${c.name}')"><i class="fa fa-phone"></i></button>
<button class="action-btn delete-btn" onclick="del(${c.id})"><i class="fa fa-trash"></i></button>
</div>
</div>`}

/* Actions */
function fav(id){
let c=contacts.find(c=>c.id===id);
c.fav=!c.fav;save()}
function del(id){
contacts=contacts.filter(c=>c.id!==id);save()}
function call(phone,name){
callHistory.unshift({name,phone,time:new Date().toLocaleString()});
localStorage.setItem("history",JSON.stringify(callHistory));
window.open("tel:"+phone)}
function searchContacts(){
let q=search.value.toLowerCase();
renderAll(contacts.filter(c=>c.name.toLowerCase().includes(q)))}

/* Modal */
function openModal(){modal.style.display="flex"}
function closeModal(){modal.style.display="none"}
function saveContact(e){
e.preventDefault();
contacts.unshift({
id:Date.now(),
name:name.value,
phone:phone.value,
blood:blood.value,
group:group.value,
fav:false});
save();closeModal()}
function save(){
localStorage.setItem("contacts",JSON.stringify(contacts));
renderAll()}
</script>

</body>
</html>
