<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contact Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" href="https://cdn-icons-png.flaticon.com/512/1256/1256650.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link rel="manifest" href="data:application/json,{
&quot;name&quot;:&quot;Contact Hub&quot;,
&quot;short_name&quot;:&quot;Contacts&quot;,
&quot;start_url&quot;:&quot;.&quot;,
&quot;display&quot;:&quot;standalone&quot;,
&quot;background_color&quot;:&quot;#6200ea&quot;,
&quot;theme_color&quot;:&quot;#6200ea&quot;
}">

<style>
:root{
--bg:#f2f2f2;
--card:#ffffff;
--text:#000;
--primary:#6200ea;
}
.dark{
--bg:#121212;
--card:#1e1e1e;
--text:#fff;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Segoe UI,Roboto;
background:var(--bg);
color:var(--text);
height:100vh;
overflow:hidden;
}

/* SPLASH */
#splash{
position:fixed;
inset:0;
background:linear-gradient(135deg,#6200ea,#3700b3);
color:white;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
z-index:1000;
animation:hideSplash 3s forwards;
}
@keyframes hideSplash{
80%{opacity:1}
100%{opacity:0;visibility:hidden}
}

/* APP BAR */
.appbar{
height:56px;
background:var(--primary);
color:white;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 16px;
font-size:1.2rem;
}

/* CONTENT */
.content{
position:absolute;
top:56px;
bottom:70px;
width:100%;
overflow-y:auto;
padding:12px;
}

/* CARD */
.card{
background:var(--card);
border-radius:16px;
padding:15px;
margin-bottom:12px;
box-shadow:0 3px 8px rgba(0,0,0,.2);
}

/* ACTIONS */
.actions{
display:flex;
justify-content:space-around;
margin-top:10px;
}
.actions button{
border:none;
background:#eee;
padding:10px;
border-radius:50%;
font-size:1.2rem;
}

/* FAB */
.fab{
position:fixed;
bottom:90px;
right:20px;
width:56px;
height:56px;
background:#03dac5;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:1.8rem;
box-shadow:0 5px 12px rgba(0,0,0,.4);
cursor:pointer;
}

/* BOTTOM NAV */
.bottom-nav{
position:fixed;
bottom:0;
height:70px;
width:100%;
background:var(--card);
display:flex;
border-top:1px solid #aaa;
}
.nav-item{
flex:1;
text-align:center;
padding-top:8px;
font-size:.75rem;
color:#666;
cursor:pointer;
}
.nav-item i{
display:block;
font-size:1.4rem;
}
.nav-item.active{
color:var(--primary);
}

/* MODAL */
#modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.6);
display:none;
align-items:center;
justify-content:center;
}
.modal{
background:var(--card);
padding:20px;
border-radius:20px;
width:90%;
}
.modal input{
width:100%;
padding:12px;
margin:8px 0;
border-radius:10px;
border:1px solid #ccc;
}
.modal button{
width:100%;
padding:12px;
border:none;
background:var(--primary);
color:white;
border-radius:10px;
font-size:1rem;
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash">
<h1>📇 Contact Hub</h1>
<p>Smart Contact Manager</p>
</div>

<!-- APP BAR -->
<div class="appbar">
<span>Contact Hub</span>
<div>
<span onclick="voiceSearch()" style="cursor:pointer;margin-right:10px">🎙️</span>
<span onclick="toggleDark()" style="cursor:pointer">🌙</span>
</div>
</div>

<!-- CONTENT -->
<div class="content" id="content"></div>

<!-- FAB -->
<div class="fab" onclick="openModal()">+</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
<div class="nav-item active" onclick="showContacts(this)">
<i class="fa fa-address-book"></i>Contacts
</div>
<div class="nav-item" onclick="showCalls(this)">
<i class="fa fa-phone"></i>Calls
</div>
<div class="nav-item" onclick="toggleDark()">
<i class="fa fa-moon"></i>Theme
</div>
</div>

<!-- MODAL -->
<div id="modal">
<div class="modal">
<h3>Add Contact</h3>
<input id="name" placeholder="Name">
<input id="phone" placeholder="Phone Number">
<button onclick="saveContact()">Save</button>
</div>
</div>

<script>
/* DARK MODE */
function toggleDark(){
document.body.classList.toggle("dark");
localStorage.setItem("dark",document.body.classList.contains("dark"));
}
if(localStorage.getItem("dark")==="true"){
document.body.classList.add("dark");
}

/* DATA */
let contacts = JSON.parse(localStorage.getItem("contacts")) || [];
let calls = JSON.parse(localStorage.getItem("calls")) || [];

/* NAV ACTIVE */
function setActive(el){
document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));
el.classList.add("active");
}

/* CONTACTS VIEW */
function showContacts(el){
if(el) setActive(el);
content.innerHTML = contacts.map(c=>`
<div class="card">
<h3>${c.name}</h3>
<p>📞 ${c.phone}</p>
<div class="actions">
<button onclick="callNow('${c.phone}')">📞</button>
<button onclick="sms('${c.phone}')">💬</button>
</div>
</div>
`).join("");
}

/* CALL HISTORY VIEW */
function showCalls(el){
if(el) setActive(el);
content.innerHTML = calls.map(c=>`
<div class="card">
<h3>📞 ${c.number}</h3>
<p>🕒 ${c.time}</p>
</div>
`).join("");
}

/* ADD CONTACT */
function openModal(){modal.style.display="flex"}
function saveContact(){
contacts.push({name:name.value,phone:phone.value});
localStorage.setItem("contacts",JSON.stringify(contacts));
modal.style.display="none";
showContacts();
}

/* CALL + HISTORY */
function callNow(num){
calls.push({
number:num,
time:new Date().toLocaleString()
});
localStorage.setItem("calls",JSON.stringify(calls));
window.open(`tel:${num}`);
}

/* SMS */
function sms(num){
window.open(`sms:${num}`);
}

/* VOICE SEARCH */
function voiceSearch(){
let rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
rec.lang="en-US";
rec.start();
rec.onresult = e=>{
let text = e.results[0][0].transcript.toLowerCase();
let result = contacts.filter(c=>c.name.toLowerCase().includes(text));
content.innerHTML = result.map(c=>`
<div class="card">
<h3>${c.name}</h3>
<p>${c.phone}</p>
</div>
`).join("");
};
}

/* INIT */
showContacts();

/* SERVICE WORKER */
if("serviceWorker" in navigator){
navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
