<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contact Hub – Location Sharing Fixed</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Arial;margin:0;background:#f4f6f9}
header{background:#111;color:#fff;padding:12px;text-align:center}
section{padding:15px}
button{padding:8px 12px;margin:4px;cursor:pointer}
input{padding:8px;margin:5px;width:90%}
#map{width:100%;height:300px;display:none;margin-top:10px}
.card{background:#fff;padding:10px;margin:8px 0;border-radius:6px}
</style>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<!-- Google Maps -->
<script src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_KEY"></script>
</head>

<body>

<header>📍 Contact Hub – Location Sharing</header>

<!-- LOGIN -->
<section id="loginPage">
  <h3>Login</h3>
  <input id="username" placeholder="Username">
  <input id="password" placeholder="Password" type="password">
  <button onclick="login()">Login</button>
</section>

<!-- APP -->
<section id="app" style="display:none">
  <h3>Welcome <span id="userLabel"></span></h3>

  <div class="card">
    <h4>Contact ID to Track</h4>
    <input id="contactIdInput" placeholder="user_contactname">
    <button onclick="sendLocationRequest()">Request Location</button>
  </div>

  <div class="card">
    <button onclick="stopSharing()">Stop Sharing My Location</button>
  </div>

  <div id="map"></div>
</section>

<script>
/* ================= FIREBASE CONFIG ================= */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT.firebaseio.com",
  projectId: "YOUR_PROJECT",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "XXXX",
  appId: "XXXX"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* ================= GLOBALS ================= */
let myUserId = null;
let watchId = null;
let map, marker;

/* ================= LOGIN ================= */
function login(){
  const u = username.value.trim();
  const p = password.value.trim();

  if(u && p){
    myUserId = "user_" + u;
    loginPage.style.display="none";
    app.style.display="block";
    userLabel.textContent = u;
    listenForRequests();
    askNotificationPermission();
  }else{
    alert("Enter credentials");
  }
}

/* ================= NOTIFICATIONS ================= */
function askNotificationPermission(){
  if("Notification" in window && Notification.permission!=="granted"){
    Notification.requestPermission();
  }
}
function notify(title,msg){
  if(Notification.permission==="granted"){
    new Notification(title,{body:msg});
  }
}

/* ================= SEND REQUEST ================= */
function sendLocationRequest(){
  const contactId = contactIdInput.value.trim();
  if(!contactId){ alert("Enter contact ID"); return; }

  const reqId = myUserId + "_" + contactId + "_" + Date.now();

  db.ref("locationRequests/"+reqId).set({
    from: myUserId,
    to: contactId,
    status:"pending"
  });

  alert("Location request sent");

  db.ref("locationRequests/"+reqId).on("value",snap=>{
    const d = snap.val();
    if(!d) return;
    if(d.status==="accepted"){
      notify("Accepted","Contact shared location");
      trackContact(contactId);
    }
    if(d.status==="declined"){
      alert("Request declined");
    }
  });
}

/* ================= RECEIVE REQUEST ================= */
function listenForRequests(){
  db.ref("locationRequests").on("child_added",snap=>{
    const r = snap.val();
    if(!r || r.to!==myUserId || r.status!=="pending") return;

    notify("Location Request", r.from+" wants your location");

    const ok = confirm(r.from+" wants your live location. Allow?");
    if(ok){
      snap.ref.update({status:"accepted"});
      startSharing();
    }else{
      snap.ref.update({status:"declined"});
    }
  });
}

/* ================= SHARE LOCATION ================= */
function startSharing(){
  if(!navigator.geolocation){
    alert("Geolocation not supported");
    return;
  }

  watchId = navigator.geolocation.watchPosition(pos=>{
    db.ref("liveLocations/"+myUserId).set({
      lat:pos.coords.latitude,
      lng:pos.coords.longitude,
      time:Date.now()
    });
  },{
    enableHighAccuracy:true
  });

  alert("Location sharing started");
}

/* ================= STOP SHARING ================= */
function stopSharing(){
  if(watchId){
    navigator.geolocation.clearWatch(watchId);
    watchId=null;
    alert("Location sharing stopped");
  }
}

/* ================= TRACK CONTACT ================= */
function trackContact(contactId){
  mapDiv = document.getElementById("map");
  mapDiv.style.display="block";

  if(!map){
    map = new google.maps.Map(mapDiv,{
      zoom:15,
      center:{lat:0,lng:0}
    });
  }

  db.ref("liveLocations/"+contactId).on("value",snap=>{
    const loc = snap.val();
    if(!loc) return;

    const p = {lat:loc.lat,lng:loc.lng};
    if(!marker){
      marker = new google.maps.Marker({map,position:p});
    }else{
      marker.setPosition(p);
    }
    map.setCenter(p);
  });
}
</script>

</body>
</html>
