<!DOCTYPE html>
<html lang="en">
<head>

  <title>Contact Hub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="presentation">

<div class="presentation-container">
  <h1>Welcome to Contact Hub</h1>
  <p class="subtitle">
    Smart Contact Management with Security & Tracking
  </p>

  <div class="card-container">
    <div class="glass-card" onclick="goNext()">
      <h2>Contact Hub</h2>
      <p>Calls, messages, reminders, blood groups, favorites</p>
    </div>

    <div class="glass-card" onclick="goNext()">
      <h2>Secure Access</h2>
      <p>Login, private contacts, restore & statistics</p>
    </div>
  </div>

  <button class="enter-btn" onclick="goNext()">ENTER</button>
</div>

<script>
function goNext() {
  window.location.href = "login.html";
}
</script>

</body>
</html>
