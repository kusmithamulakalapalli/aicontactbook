<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Hub </title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
/* ---------------- Global ---------------- */
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif;}
body { min-height:100vh; background: linear-gradient(135deg,#764ba2,#667eea); color:#333;}
.hidden { display:none; }

/* ---------------- Splash ---------------- */
#splash { position:fixed; top:0; left:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#1a1a2e;color:white;z-index:1000;}
.title { font-size:4rem;color:#4ecdc4;text-shadow:0 0 20px #4ecdc4; animation: glow 2s infinite; margin-bottom:1rem;}
@keyframes glow{0%,100%{text-shadow:0 0 20px #4ecdc4;}50%{text-shadow:0 0 40px #ff6b6b;}}
.enter-btn{background:linear-gradient(45deg,#ff6b6b,#4ecdc4);color:white;border:none;padding:15px 40px;font-size:1.2rem;border-radius:50px;cursor:pointer;margin-top:2rem;box-shadow:0 10px 30px rgba(255,107,107,0.4);animation:bounce 2s infinite;}
.enter-btn:hover{transform:scale(1.05);box-shadow:0 15px 40px rgba(255,107,107,0.6);}
@keyframes bounce{0%,20%,50%,80%,100%{transform:translateY(0);}40%{transform:translateY(-10px);}60%{transform:translateY(-5px);}}

/* ---------------- Login ---------------- */
#login-page{display:none;min-height:100vh;justify-content:center;align-items:center;padding:2rem;}
.login-card{background:rgba(255,255,255,0.95);backdrop-filter:blur(20px);padding:3rem;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,0.3);width:100%;max-width:400px;text-align:center;}
.login-card h2{margin-bottom:2rem;color:#333;}
input{width:100%;padding:15px;margin:1rem 0;border:2px solid #eee;border-radius:10px;font-size:1rem;transition:border 0.3s;}
input:focus{outline:none;border-color:#667eea;box-shadow:0 0 0 3px rgba(102,126,234,0.1);}
.login-btn{background:linear-gradient(45deg,#667eea,#764ba2);color:white;border:none;padding:15px;width:100%;border-radius:10px;font-size:1.1rem;cursor:pointer;font-weight:600;transition:transform 0.3s;}
.login-btn:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(102,126,234,0.4);}

/* ---------------- App Layout ---------------- */
#app{display:none;min-height:100vh;}
.header{padding:1rem 1rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap;background:rgba(255,255,255,0.95);backdrop-filter:blur(10px);box-shadow:0 2px 20px rgba(0,0,0,0.1);}
.nav-tabs{display:flex;gap:0;background:rgba(102,126,234,0.2);border-radius:15px;padding:5px;margin-right:auto;overflow-x:auto;}
.tab-btn{background:transparent;border:none;padding:12px 24px;color:rgba(255,255,255,0.8);border-radius:12px;cursor:pointer;font-weight:500;transition:all 0.3s;font-size:0.95rem;display:flex;align-items:center;gap:8px;}
.tab-btn.active{background:rgba(255,255,255,0.95);color:#333;box-shadow:0 5px 20px rgba(0,0,0,0.2);}
.tab-btn:hover:not(.active){background:rgba(255,255,255,0.3);color:white;}
.controls{display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap;}
#search{padding:10px 20px;border:2px solid #667eea;border-radius:25px;background:white;cursor:pointer;transition:all 0.3s;font-size:0.9rem;min-width:200px;}
#voice-btn{padding:10px;border:2px solid #667eea;border-radius:50%;background:white;cursor:pointer;transition:all 0.3s;width:45px;height:45px;display:flex;align-items:center;justify-content:center;}
#voice-btn.active{background:#ff6b6b;color:white;border-color:#ff6b6b;}
#add-contact{background:linear-gradient(45deg,#4ecdc4,#44a08d);color:white;border:none;padding:10px 16px;border-radius:25px;cursor:pointer;font-size:0.9rem;font-weight:500;transition:all 0.3s;}

/* ---------------- Pages ---------------- */
.app-page{display:none;padding:2rem;min-height:calc(100vh - 140px);}
.app-page.active{display:block;}
.page-title{padding:1.5rem 0;border-bottom:2px solid rgba(255,255,255,0.1);margin-bottom:2rem;color:white;}
.page-title h2{font-size:1.8rem;display:flex;align-items:center;gap:1rem;}

/* ---------------- Contacts ---------------- */
.contacts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.5rem;}
.contact-card{background:rgba(255,255,255,0.95);border-radius:20px;padding:1.5rem;box-shadow:0 10px 40px rgba(0,0,0,0.1);position:relative;overflow:hidden;transition:transform 0.3s,box-shadow 0.3s;}
.contact-card:hover{transform:translateY(-5px);box-shadow:0 20px 60px rgba(0,0,0,0.2);}
.contact-avatar{width:60px;height:60px;border-radius:50%;background:linear-gradient(45deg,#667eea,#764ba2);color:white;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:1.2rem;margin-bottom:1rem;overflow:hidden;}
.contact-name{font-size:1.3rem;font-weight:bold;color:#333;margin-bottom:0.5rem;}
.contact-phone,.contact-email,.contact-notes{color:#666;font-size:0.95rem;margin-bottom:0.3rem;}
.group-tag,.blood-tag,.emergency-tag,.private-tag{display:inline-block;padding:3px 8px;border-radius:12px;font-size:0.7rem;color:white;margin-right:3px;margin-top:3px;}
.group-tag{background:linear-gradient(45deg,#667eea,#764ba2);}
.blood-tag{background:#ff6b6b;}
.emergency-tag{background:#f0932b;}
.private-tag{background:#555;}
.contact-actions{display:flex;gap:0.5rem;margin-top:1rem;}
.action-btn{padding:8px 12px;border:none;border-radius:50%;cursor:pointer;font-size:1rem;transition:transform 0.2s;width:40px;height:40px;display:flex;align-items:center;justify-content:center;}
.call-btn{background:#4ecdc4;color:white;}
.msg-btn{background:#f9ca24;color:white;}
.edit-btn{background:#667eea;color:white;}
.delete-btn{background:#ff6b6b;color:white;}
.location-btn{background:#45b7d1;color:white;padding:6px 8px;border-radius:12px;margin-top:5px;width:100%;}

/* ---------------- Groups ---------------- */
.groups-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.5rem;}
.group-card{background:rgba(255,255,255,0.95);border-radius:20px;padding:2rem;box-shadow:0 10px 40px rgba(0,0,0,0.1);cursor:pointer;transition:all 0.3s;position:relative;overflow:hidden;text-align:center;}
.group-color{height:8px;position:absolute;top:0;left:0;right:0;border-radius:20px 20px 0 0;}
.group-name{font-size:1.5rem;font-weight:bold;color:#333;margin-bottom:1rem;}
.group-count{color:#666;font-size:1.1rem;}
.group-contacts{display:flex;flex-wrap:wrap;gap:0.5rem;margin-top:1rem;justify-content:center;}
.group-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(45deg,#667eea,#764ba2);color:white;display:flex;align-items:center;justify-content:center;font-size:0.8rem;}

/* ---------------- History ---------------- */
.history-card{background:white;border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 3px 10px rgba(0,0,0,0.1);}
.history-card .avatar{width:50px;height:50px;border-radius:50%;background:linear-gradient(45deg,#667eea,#764ba2);color:white;display:flex;align-items:center;justify-content:center;font-weight:bold;}
.history-info{flex:1;}
.history-info .name{font-weight:bold;color:#333;}
.history-info .details{font-size:0.8rem;color:#666;}

/* ---------------- Modal ---------------- */
#modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:1000;justify-content:center;align-items:center;}
.modal-content{background:white;padding:2rem;border-radius:20px;width:90%;max-width:500px;max-height:80vh;overflow-y:auto;position:relative;}
.close{position:absolute;top:20px;right:30px;font-size:2rem;cursor:pointer;color:#999;}
textarea, select{width:100%;padding:12px;margin:0.5rem 0;border:2px solid #eee;border-radius:10px;}

@media(max-width:768px){.contacts-grid,.groups-grid{grid-template-columns:1fr;padding:1rem;}.header{flex-direction:column;gap:1rem;text-align:center;}.nav-tabs{order:3;width:100%;justify-content:center;}.controls{order:2;width:100%;justify-content:center;}}
</style>
</head>
<body>

<!-- Splash -->
<div id="splash">
  <div class="title">Contact Hub</div>
  <div class="subtitle">Your Smart Contact Manager</div>
  <button class="enter-btn" onclick="enterApp()">Enter</button>
</div>

<!-- Login Page -->
<div id="login-page">
  <div class="login-card">
    <h2><i class="fas fa-lock"></i> Welcome Back</h2>
    <input type="text" id="username" placeholder="Username" value="admin">
    <input type="password" id="password" placeholder="Password" value="123">
    <button class="login-btn" onclick="login()">Login</button>
  </div>
</div>

<!-- Main App -->
<div id="app">
  <div class="header">
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="showPage('all')">All Contacts</button>
      <button class="tab-btn" onclick="showPage('favorites')">Favorites</button>
      <button class="tab-btn" onclick="showPage('groups')">Groups</button>
      <button class="tab-btn" onclick="showPage('history')">Call History</button>
      <button class="tab-btn" onclick="showPage('dashboard')">Dashboard</button>
    </div>
    <div class="controls">
      <input type="text" id="search" placeholder="🔍 Search contacts..." oninput="searchContacts()">
      <button id="voice-btn" onclick="toggleVoiceSearch()"><i class="fas fa-microphone"></i></button>
      <button id="add-contact" onclick="openModal('add')"><i class="fas fa-plus"></i> Add Contact</button>
    </div>
  </div>

  <!-- Pages -->
  <div id="page-all" class="app-page active"><div class="contacts-grid" id="contacts-grid-all"></div></div>
  <div id="page-favorites" class="app-page"><div class="contacts-grid" id="contacts-grid-fav"></div></div>
  <div id="page-groups" class="app-page"><div class="groups-grid" id="groups-grid"></div></div>
  <div id="page-history" class="app-page"><div id="history-grid"></div></div>
  <div id="page-dashboard" class="app-page"><h2 style="color:white;">Dashboard (Analytics Coming Soon)</h2></div>
</div>

<!-- Modal -->
<div id="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <h2 id="modal-title">Add Contact</h2>
    <form id="contact-form">
      <input type="file" id="avatar" accept="image/*" onchange="previewAvatar()">
      <div class="contact-avatar" id="avatar-preview">👤</div>
      <input type="text" id="name" placeholder="Name *" required>
      <input type="tel" id="phone" placeholder="Phone *">
      <input type="email" id="email" placeholder="Email">
      <input type="date" id="birthday" placeholder="Birthday">
      <input type="text" id="group" placeholder="Group">
      <select id="blood-group">
        <option value="">Select Blood Group</option>
        <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
        <option>O+</option><option>O-</option><option>AB+</option><option>AB-</option>
      </select>
      <label><input type="checkbox" id="emergency"> Emergency Contact</label>
      <label><input type="checkbox" id="private"> Hidden/Private Contact</label>
      <textarea id="notes" placeholder="Notes"></textarea>
      <button type="submit" class="login-btn" style="margin-top:1rem;">Save Contact</button>
    </form>
  </div>
</div>

<script>
// ---------------- Initialization ----------------
let contacts = JSON.parse(localStorage.getItem('contacts')) || [];
let history = JSON.parse(localStorage.getItem('callHistory')) || [];
let editingId = null;
let recognition = null;
let currentPage = 'all';

// ---------------- Splash ----------------
function enterApp(){ document.getElementById('splash').style.display='none'; document.getElementById('login-page').style.display='flex'; }

// ---------------- Login ----------------
function login(){ document.getElementById('login-page').style.display='none'; document.getElementById('app').style.display='block'; renderAllContacts(); renderFavorites(); renderGroups(); renderHistory(); }

// ---------------- Tabs ----------------
function showPage(page){
  currentPage = page;
  document.querySelectorAll('.tab-btn').forEach(btn=>btn.classList.remove('active'));
  event.target.classList.add('active');
  document.querySelectorAll('.app-page').forEach(p=>p.classList.remove('active'));
  document.getElementById(`page-${page}`).classList.add('active');
  if(page==='all') renderAllContacts();
  if(page==='favorites') renderFavorites();
  if(page==='groups') renderGroups();
  if(page==='history') renderHistory();
}

// ---------------- Modal ----------------
function openModal(mode,id=null){
  editingId=id; document.getElementById('modal-title').textContent=mode==='add'?'Add Contact':'Edit Contact';
  if(id){ let c=contacts.find(c=>c.id===id); document.getElementById('name').value=c.name;document.getElementById('phone').value=c.phone;document.getElementById('email').value=c.email;document.getElementById('birthday').value=c.birthday;document.getElementById('group').value=c.group;document.getElementById('blood-group').value=c.bloodGroup;document.getElementById('notes').value=c.notes;document.getElementById('emergency').checked=c.emergency;document.getElementById('private').checked=c.private;}
  document.getElementById('modal').style.display='flex';
}
function closeModal(){ document.getElementById('modal').style.display='none';document.getElementById('contact-form').reset();editingId=null;document.getElementById('avatar-preview').textContent='👤'; }
document.getElementById('contact-form').addEventListener('submit',(e)=>{
  e.preventDefault();
  const contact={
    id:editingId||Date.now(),
    name:document.getElementById('name').value,
    phone:document.getElementById('phone').value,
    email:document.getElementById('email').value,
    birthday:document.getElementById('birthday').value,
    group:document.getElementById('group').value||'Uncategorized',
    bloodGroup:document.getElementById('blood-group').value,
    emergency:document.getElementById('emergency').checked,
    private:document.getElementById('private').checked,
    notes:document.getElementById('notes').value,
    favorite:false,
    avatar:document.getElementById('avatar-preview').dataset.src||null
  };
  if(editingId){ contacts=contacts.map(c=>c.id===editingId?contact:c); } else contacts.push(contact);
  localStorage.setItem('contacts',JSON.stringify(contacts));
  closeModal(); renderAllContacts(); renderFavorites(); renderGroups();
});

// ---------------- Avatar Preview ----------------
function previewAvatar(){
  const file=document.getElementById('avatar').files[0];
  if(file){
    const reader=new FileReader();
    reader.onload=function(){ document.getElementById('avatar-preview').style.backgroundImage=`url(${reader.result})`;document.getElementById('avatar-preview').textContent='';document.getElementById('avatar-preview').dataset.src=reader.result;}
    reader.readAsDataURL(file);
  }
}

// ---------------- Render Contacts ----------------
function renderAllContacts(){
  const grid=document.getElementById('contacts-grid-all'); grid.innerHTML='';
  contacts.forEach(c=>{
    const card=document.createElement('div'); card.className='contact-card';
    card.innerHTML=`<div class="contact-avatar" style="background-image:url(${c.avatar||''});background-size:cover;">${!c.avatar?c.name[0]:' '}</div>
    <div class="contact-name">${c.name}</div>
    <div class="contact-phone">${c.phone}</div>
    <div class="contact-email">${c.email||''}</div>
    <span class="group-tag">${c.group}</span>
    <span class="blood-tag">${c.bloodGroup||''}</span>
    ${c.emergency?'<span class="emergency-tag">🚨</span>':''}
    ${c.private?'<span class="private-tag">🔒</span>':''}
    <div class="contact-actions">
      <button class="action-btn call-btn" onclick="makeCall('${c.phone}')"><i class="fas fa-phone"></i></button>
      <button class="action-btn msg-btn" onclick="sendMsg('${c.phone}')"><i class="fas fa-comment"></i></button>
      <button class="action-btn location-btn" onclick="trackLocation('${c.name}')"><i class="fas fa-map-marker-alt"></i> Track</button>
      <button class="action-btn edit-btn" onclick="openModal('edit',${c.id})"><i class="fas fa-edit"></i></button>
      <button class="action-btn delete-btn" onclick="deleteContact(${c.id})"><i class="fas fa-trash"></i></button>
    </div>`;
    grid.appendChild(card);
  });
}
function renderFavorites(){ const grid=document.getElementById('contacts-grid-fav');grid.innerHTML='';contacts.filter(c=>c.favorite).forEach(c=>{ const card=document.createElement('div'); card.className='contact-card'; card.innerHTML=`<div class="contact-avatar">${c.name[0]}</div><div class="contact-name">${c.name}</div>`;grid.appendChild(card);}); }
function renderGroups(){ const grid=document.getElementById('groups-grid');grid.innerHTML=''; const groupMap={};contacts.forEach(c=>{ if(!groupMap[c.group]) groupMap[c.group]=[]; groupMap[c.group].push(c);}); for(let g in groupMap){ const card=document.createElement('div'); card.className='group-card'; card.innerHTML=`<div class="group-color" style="background:linear-gradient(45deg,#667eea,#764ba2)"></div><div class="group-name">${g}</div><div class="group-count">${groupMap[g].length} Contacts</div>`; grid.appendChild(card);} }
function renderHistory(){ const grid=document.getElementById('history-grid'); grid.innerHTML=''; history.forEach(h=>{ const card=document.createElement('div'); card.className='history-card'; card.innerHTML=`<div class="avatar">${h.name[0]}</div><div class="history-info"><div class="name">${h.name}</div><div class="details">${h.type} call • ${h.time}</div></div>`; grid.appendChild(card);}); }

// ---------------- Actions ----------------
function makeCall(phone){ window.open(`tel:${phone}`); addHistory('Call',phone); }
function sendMsg(phone){ window.open(`sms:${phone}`); addHistory('SMS',phone); }
function trackLocation(name){ if(navigator.geolocation){ navigator.geolocation.getCurrentPosition(pos=>{ alert(`${name}'s Location:\nLatitude: ${pos.coords.latitude}\nLongitude: ${pos.coords.longitude}`); }); } else alert('Geolocation not supported.'); }
function addHistory(type,phone){ const c=contacts.find(c=>c.phone===phone); if(c){ history.push({name:c.name,type:type,time:new Date().toLocaleString()}); localStorage.setItem('callHistory',JSON.stringify(history)); renderHistory(); } }
function deleteContact(id){ if(confirm('Are you sure?')){ contacts=contacts.filter(c=>c.id!==id); localStorage.setItem('contacts',JSON.stringify(contacts)); renderAllContacts(); renderFavorites(); renderGroups(); } }
function searchContacts(){ const val=document.getElementById('search').value.toLowerCase(); document.querySelectorAll('.contact-card').forEach(card=>{ const name=card.querySelector('.contact-name').textContent.toLowerCase(); card.style.display=name.includes(val)?'block':'none'; })}

// ---------------- Voice Search ----------------
function toggleVoiceSearch(){ if(!('webkitSpeechRecognition' in window)){ alert('Voice not supported'); return; } if(!recognition){ recognition=new webkitSpeechRecognition(); recognition.continuous=false; recognition.lang='en-US'; recognition.onresult=e=>{ const transcript=e.results[0][0].transcript; document.getElementById('search').value=transcript; searchContacts(); }; recognition.start(); } else { recognition.stop(); recognition=null; } }
</script>
</body>
</html>
