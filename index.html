<!-- ONLY CHANGES ARE COMMENTED AS // NEW -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Hub - Working Demo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
/* ===== YOUR EXISTING CSS (UNCHANGED) ===== */
*{margin:0;padding:0;box-sizing:border-box;}
body{
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#b60e6d,#764ba2);
min-height:100vh;color:#333;
}
.emergency-badge{
background:red;color:white;
padding:4px 10px;border-radius:15px;
font-size:0.75rem;margin-top:6px;display:inline-block;
}
.blood-badge{
background:#6c5ce7;color:white;
padding:4px 10px;border-radius:15px;
font-size:0.75rem;margin-top:6px;display:inline-block;
}
.hidden-badge{
background:#2d3436;color:white;
padding:4px 10px;border-radius:15px;
font-size:0.75rem;margin-top:6px;display:inline-block;
}
</style>
</head>

<body>

<!-- ================= MODAL (UPDATED FORM) ================= -->
<div id="modal">
<div class="modal-content">
<span class="close" onclick="closeModal()">&times;</span>
<h2 id="modal-title">Add Contact</h2>

<form id="contact-form">

<input type="text" id="name" placeholder="Name *" required>
<input type="tel" id="phone" placeholder="Phone *">
<input type="email" id="email" placeholder="Email">
<input type="date" id="birthday">
<input type="text" id="group" placeholder="Group">

<!-- 🔥 NEW BLOOD GROUP -->
<select id="blood">
<option value="">Select Blood Group</option>
<option>A+</option><option>A-</option>
<option>B+</option><option>B-</option>
<option>O+</option><option>O-</option>
<option>AB+</option><option>AB-</option>
</select>

<!-- 🔥 NEW CHECKBOXES -->
<label><input type="checkbox" id="emergency"> Emergency Contact</label><br>
<label><input type="checkbox" id="hidden"> Hidden Contact</label>

<textarea id="notes" placeholder="Notes"></textarea>

<button type="submit" class="login-btn">Save Contact</button>
</form>
</div>
</div>

<script>
/* ===== YOUR EXISTING JS + NEW FEATURES ===== */

let contacts = JSON.parse(localStorage.getItem("contacts")) || [];
const PIN = "1234"; // 🔒 hidden contact pin

document.getElementById("contact-form").addEventListener("submit", e=>{
e.preventDefault();

const contact = {
id: Date.now(),
name: name.value,
phone: phone.value,
email: email.value,
birthday: birthday.value,
group: group.value || "Uncategorized",
notes: notes.value,
blood: blood.value,              // 🆕
emergency: emergency.checked,    // 🆕
hidden: hidden.checked,          // 🆕
favorite: false
};

/* 🧠 AI RULE BASED LOGIC */
if(contact.emergency || contact.group.toLowerCase()=="family"){
contact.favorite = true;
}

contacts.unshift(contact);
localStorage.setItem("contacts",JSON.stringify(contacts));
closeModal();
renderAllContacts();
});

/* ===== UPDATED CONTACT CARD ===== */
function createContactHTML(list){
return list.map(c=>{

if(c.hidden){
let pin = prompt("Enter PIN to view hidden contact:");
if(pin!==PIN) return "";
}

return `
<div class="contact-card">
<button class="fav-btn ${c.favorite?"active":""}">❤️</button>
<div class="contact-name">${c.name}</div>
<div>${c.phone}</div>

${c.blood?`<div class="blood-badge">🩸 ${c.blood}</div>`:""}
${c.emergency?`<div class="emergency-badge">🚨 Emergency</div>`:""}
${c.hidden?`<div class="hidden-badge">🔒 Private</div>`:""}

</div>
`;
}).join("");
}

function renderAllContacts(){
document.getElementById("contacts-grid-all").innerHTML =
createContactHTML(contacts);
}

/* INITIAL RENDER */
renderAllContacts();
</script>

</body>
</html>
