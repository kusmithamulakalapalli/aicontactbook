<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Hub 5.0</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
/* ---------- GENERAL ---------- */
* {margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#b60e6d 0%,#764ba2 100%);color:#333;min-height:100vh;}
button, input, select, textarea {outline:none;}
a{text-decoration:none;color:inherit;}

/* ---------- SPLASH ---------- */
#splash{position:fixed;top:0;left:0;width:100%;height:100%;background:#1a1a2e;display:flex;flex-direction:column;justify-content:center;align-items:center;color:white;z-index:1000;}
#splash .title{font-size:4rem;color:#4ecdc4;text-shadow:0 0 20px #4ecdc4;animation:glow 2s infinite;margin-bottom:1rem;}
@keyframes glow{0%,100%{text-shadow:0 0 20px #4ecdc4;}50%{text-shadow:0 0 40px #ff6b6b;}}
.enter-btn{background:linear-gradient(45deg,#ff6b6b,#4ecdc4);color:white;border:none;padding:15px 40px;font-size:1.2rem;border-radius:50px;cursor:pointer;box-shadow:0 10px 30px rgba(255,107,107,0.4);transition:all 0.3s ease;animation:bounce 2s infinite;}
.enter-btn:hover{transform:scale(1.05);box-shadow:0 15px 40px rgba(255,107,107,0.6);}
@keyframes bounce{0%,20%,50%,80%,100%{transform:translateY(0);}40%{transform:translateY(-10px);}60%{transform:translateY(-5px);}}

/* ---------- LOGIN ---------- */
#login-page{display:none;min-height:100vh;justify-content:center;align-items:center;padding:2rem;}
.login-card{background:rgba(255,255,255,0.95);backdrop-filter:blur(20px);padding:3rem;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,0.3);width:100%;max-width:400px;text-align:center;}
.login-card h2{color:#333;margin-bottom:2rem;font-size:2rem;}
input{width:100%;padding:15px;margin:1rem 0;border:2px solid #eee;border-radius:10px;font-size:1rem;transition:border 0.3s;}
input:focus{border-color:#667eea;box-shadow:0 0 0 3px rgba(102,126,234,0.1);}
.login-btn{background:linear-gradient(45deg,#667eea,#764ba2);color:white;border:none;padding:15px;width:100%;border-radius:10px;font-size:1.1rem;cursor:pointer;transition:transform 0.3s;font-weight:600;}
.login-btn:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(102,126,234,0.4);}

/* ---------- HEADER ---------- */
#app{display:none;min-height:100vh;}
.header{padding:1rem 1.5rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap;background:rgba(255,255,255,0.95);backdrop-filter:blur(10px);box-shadow:0 2px 20px rgba(0,0,0,0.1);}
.nav-tabs{display:flex;gap:0;background:rgba(102,126,234,0.2);border-radius:15px;padding:5px;margin-right:auto;flex-wrap:wrap;}
.tab-btn{background:transparent;border:none;padding:10px 20px;color:rgba(255,255,255,0.8);border-radius:12px;cursor:pointer;font-weight:500;transition:all 0.3s;display:flex;align-items:center;gap:6px;font-size:0.9rem;}
.tab-btn.active{background:rgba(255,255,255,0.95);color:#333;box-shadow:0 5px 20px rgba(0,0,0,0.2);}
.tab-btn:hover:not(.active){background:rgba(255,255,255,0.3);color:white;}
.controls{display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap;}
#search{padding:10px 20px;border:2px solid #667eea;border-radius:25px;background:white;cursor:pointer;transition:all 0.3s;font-size:0.9rem;min-width:180px;}
#voice-btn{padding:10px;border:2px solid #667eea;border-radius:50%;background:white;cursor:pointer;transition:all 0.3s;width:45px;height:45px;display:flex;align-items:center;justify-content:center;}
#voice-btn.active{background:#ff6b6b;color:white;border-color:#ff6b6b;}
#add-contact{background:linear-gradient(45deg,#4ecdc4,#44a08d);color:white;border:none;padding:10px 16px;border-radius:25px;cursor:pointer;font-size:0.9rem;font-weight:500;transition:all 0.3s;}
#add-contact:hover{transform:scale(1.05);}

/* ---------- APP PAGES ---------- */
.app-page{display:none;padding:1rem 1.5rem;min-height:calc(100vh - 130px);}
.app-page.active{display:block;}
.page-title{padding:1rem 0;border-bottom:2px solid rgba(255,255,255,0.1);margin-bottom:1rem;color:white;}
.page-title h2{font-size:1.6rem;display:flex;align-items:center;gap:0.5rem;}

/* ---------- CONTACT CARD ---------- */
.contacts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1.5rem;}
.contact-card{background:rgba(255,255,255,0.95);border-radius:15px;padding:1rem;box-shadow:0 10px 40px rgba(0,0,0,0.1);position:relative;overflow:hidden;transition:0.3s;}
.contact-card:hover{transform:translateY(-5px);box-shadow:0 20px 60px rgba(0,0,0,0.2);}
.contact-avatar{width:60px;height:60px;border-radius:50%;background:linear-gradient(45deg,#667eea,#764ba2);color:white;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:1.2rem;margin-bottom:0.5rem;}
.contact-name{font-size:1.2rem;font-weight:bold;color:#333;margin-bottom:0.3rem;}
.contact-phone,.contact-email,.contact-blood,.contact-group{font-size:0.9rem;color:#555;margin-bottom:0.2rem;}
.contact-actions{display:flex;gap:0.5rem;margin-top:0.8rem;flex-wrap:wrap;}
.action-btn{padding:8px 12px;border:none;border-radius:50%;cursor:pointer;font-size:1rem;width:40px;height:40px;display:flex;align-items:center;justify-content:center;transition:0.2s;}
.call-btn{background:#4ecdc4;color:white;}
.msg-btn{background:#f9ca24;color:white;}
.edit-btn{background:#667eea;color:white;}
.delete-btn{background:#ff6b6b;color:white;}
.location-btn{background:#ff6b6b;color:white;}
.block-btn{background:#999;color:white;}
.fav-btn{position:absolute;top:10px;right:10px;background:none;border:none;font-size:1.3rem;cursor:pointer;color:#ffd700;}
.fav-btn.active{color:#ff6b6b;animation:heartBeat 0.3s;}
@keyframes heartBeat{0%,100%{transform:scale(1);}50%{transform:scale(1.2);}}

/* ---------- MODAL ---------- */
#modal,#private-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:1000;justify-content:center;align-items:center;}
.modal-content{background:white;padding:1.5rem;border-radius:15px;width:90%;max-width:500px;max-height:80vh;overflow-y:auto;position:relative;}
.close{position:absolute;top:10px;right:20px;font-size:1.8rem;cursor:pointer;color:#999;}
input[type=file]{padding:5px;}
textarea{width:100%;padding:8px;border-radius:10px;border:2px solid #eee;margin-top:0.3rem;}
select#blood {width: 100%; padding: 15px; margin: 1rem 0; border: 2px solid #eee; border-radius: 10px; font-size: 1rem; transition: border 0.3s;}
select#blood:focus {border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.1);}

/* ---------- HISTORY ---------- */
#history-grid{display:grid;grid-template-columns:1fr;gap:0.5rem;}
.history-card{background:#fff3cd;padding:0.5rem 1rem;border-radius:10px;font-size:0.9rem;color:#333;}

/* ---------- RESPONSIVE ---------- */
@media(max-width:768px){.contacts-grid{grid-template-columns:1fr;}.header{flex-direction:column;gap:1rem;}.nav-tabs{order:3;width:100%;justify-content:center;}.controls{order:2;width:100%;justify-content:center;}}
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div class="title">Contact Hub</div>
  <div class="subtitle">Your Smart Contact Manager</div>
  <button class="enter-btn" onclick="enterApp()"><i class="fas fa-arrow-right"></i> Enter</button>
</div>

<!-- LOGIN -->
<div id="login-page">
  <div class="login-card">
    <h2><i class="fas fa-lock"></i> Welcome Back</h2>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button class="login-btn" onclick="login()"><i class="fas fa-sign-in-alt"></i> Login</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="header">
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="showPage('all')"><i class="fas fa-address-book"></i> All Contacts</button>
      <button class="tab-btn" onclick="showPage('favorites')"><i class="fas fa-heart"></i> Favorites</button>
      <button class="tab-btn" onclick="showPage('groups')"><i class="fas fa-users"></i> Groups</button>
      <button class="tab-btn" onclick="showPrivate()"><i class="fas fa-lock"></i> Private Contacts</button>
      <button class="tab-btn" onclick="showPage('blocked')"><i class="fas fa-ban"></i> Blocked Contacts</button>
      <button class="tab-btn" onclick="showPage('emergency')"><i class="fas fa-ambulance"></i> Emergency Contacts</button>
      <button class="tab-btn" onclick="showPage('history')"><i class="fas fa-history"></i> History</button>
    </div>
    <div class="controls">
      <input type="text" id="search" placeholder="🔍 Search contacts..." oninput="searchContacts()">
      <button id="voice-btn" onclick="toggleVoiceSearch()"><i class="fas fa-microphone"></i></button>
      <button id="add-contact" onclick="openModal('add')"><i class="fas fa-plus"></i> Add Contact</button>
    </div>
  </div>

  <!-- ALL CONTACTS -->
  <div id="page-all" class="app-page active">
    <div class="page-title"><h2>All Contacts (<span id="all-count">0</span>)</h2></div>
    <div class="contacts-grid" id="contacts-grid-all"></div>
  </div>

  <!-- FAVORITES -->
  <div id="page-favorites" class="app-page">
    <div class="page-title"><h2>Favorites (<span id="fav-count">0</span>)</h2></div>
    <div class="contacts-grid" id="contacts-grid-fav"></div>
  </div>

  <!-- GROUPS -->
  <div id="page-groups" class="app-page">
    <div class="page-title"><h2>Groups (<span id="group-count">0</span>)</h2></div>
    <div class="contacts-grid" id="contacts-grid-groups"></div>
  </div>

  <!-- PRIVATE CONTACTS -->
  <div id="page-private" class="app-page">
    <div class="page-title"><h2>Private Contacts (<span id="private-count">0</span>)</h2></div>
    <div class="contacts-grid" id="contacts-grid-private"></div>
  </div>

  <!-- BLOCKED CONTACTS -->
  <div id="page-blocked" class="app-page">
    <div class="page-title"><h2>Blocked Contacts (<span id="blocked-count">0</span>)</h2></div>
    <div class="contacts-grid" id="contacts-grid-blocked"></div>
  </div>

  <!-- EMERGENCY CONTACTS -->
  <div id="page-emergency" class="app-page">
    <div class="page-title"><h2>Emergency Contacts (<span id="emergency-count">0</span>)</h2></div>
    <div class="contacts-grid" id="contacts-grid-emergency"></div>
  </div>

  <!-- HISTORY -->
  <div id="page-history" class="app-page">
    <div class="page-title"><h2>Call / Message History (<span id="history-count">0</span>)</h2></div>
    <div id="history-grid"></div>
    <canvas id="chart" style="margin-top:1rem;"></canvas>
  </div>
</div>

<!-- CONTACT MODAL -->
<div id="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <h2 id="modal-title">Add Contact</h2>
    <form id="contact-form">
      <input type="file" id="avatar" accept="image/*" onchange="previewAvatar()">
      <div class="contact-avatar" id="avatar-preview">👤</div>
      <input type="text" id="name" placeholder="Name *" required>
      <input type="tel" id="phone" placeholder="Phone *">
      <input type="email" id="email" placeholder="Email">
      <input type="date" id="birthday" placeholder="Birthday">
      <select id="blood" required>
        <option value="" disabled selected>Select Blood Group</option>
        <option value="A+">A+</option>
        <option value="A-">A-</option>
        <option value="B+">B+</option>
        <option value="B-">B-</option>
        <option value="AB+">AB+</option>
        <option value="AB-">AB-</option>
        <option value="O+">O+</option>
        <option value="O-">O-</option>
      </select>
      <input type="text" id="group" placeholder="Group">
      <textarea id="notes" placeholder="Notes"></textarea>
      <label><input type="checkbox" id="emergency"> Emergency Contact 🚨</label>
      <label><input type="checkbox" id="private"> Private 🔒</label>
      <button type="submit" class="login-btn" style="margin-top:1rem;">Save Contact</button>
    </form>
  </div>
</div>

<!-- PRIVATE UNLOCK MODAL -->
<div id="private-modal">
  <div class="modal-content">
    <span class="close" onclick="closePrivateModal()">&times;</span>
    <h2>Enter PIN to View Private Contacts</h2>
    <input type="password" id="private-pin" placeholder="Enter PIN">
    <button class="login-btn" onclick="unlockPrivate()">Unlock 🔒</button>
  </div>
</div>

<script>
let contacts = JSON.parse(localStorage.getItem('contacts')) || [];
let history = JSON.parse(localStorage.getItem('history')) || [];
let editingId = null;
let recognition = null;
const PRIVATE_PIN = "1234";

function enterApp(){
    document.getElementById('splash').style.display='none';
    document.getElementById('login-page').style.display='flex';
}

function login(){
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    if(username === "admin" && password === "123"){
        document.getElementById('login-page').style.display='none';
        document.getElementById('app').style.display='block';
        renderAll(); renderFavorites(); renderGroups(); renderEmergency(); renderBlocked();
    } else { alert("Invalid username or password!"); }
}

function showPage(page){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  document.querySelectorAll('.app-page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+page).classList.add('active');
}

function showPrivate(){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector('button[onclick="showPrivate()"]').classList.add('active');
  document.getElementById('private-modal').style.display='flex';
}
function unlockPrivate(){
  const pin = document.getElementById('private-pin').value;
  if(pin===PRIVATE_PIN){
    document.getElementById('private-modal').style.display='none';
    renderPrivate();
    showPage('private');
    document.getElementById('private-pin').value='';
  } else { alert("Incorrect PIN!"); }
}
function closePrivateModal(){
  document.getElementById('private-modal').style.display='none';
  document.getElementById('private-pin').value='';
}

// ---------- RENDER FUNCTIONS ----------
function renderAll(){
  renderGrid('contacts-grid-all',contacts.filter(c=>!c.private && !c.blocked));
  document.getElementById('all-count').innerText=contacts.filter(c=>!c.private && !c.blocked).length;
}
function renderFavorites(){
  renderGrid('contacts-grid-fav',contacts.filter(c=>c.favorite && !c.private && !c.blocked));
  document.getElementById('fav-count').innerText=contacts.filter(c=>c.favorite && !c.private && !c.blocked).length;
}
function renderGroups(){
  let groups={};
  contacts.filter(c=>!c.private && !c.blocked).forEach(c=>{let g=c.group||'Uncategorized';if(!groups[g]) groups[g]=[];groups[g].push(c);});
  let html='';
  Object.entries(groups).forEach(([g,list])=>{html+=`<div class="contact-card" onclick="filterGroup('${g}')"><b>${g}</b><div>${list.length} contacts</div></div>`;});
  document.getElementById('contacts-grid-groups').innerHTML=html;
  document.getElementById('group-count').innerText=Object.keys(groups).length;
}
function renderPrivate(){renderGrid('contacts-grid-private',contacts.filter(c=>c.private));document.getElementById('private-count').innerText=contacts.filter(c=>c.private).length;}
function renderBlocked(){renderGrid('contacts-grid-blocked',contacts.filter(c=>c.blocked));document.getElementById('blocked-count').innerText=contacts.filter(c=>c.blocked).length;}
function renderEmergency(){renderGrid('contacts-grid-emergency',contacts.filter(c=>c.emergency && !c.blocked));document.getElementById('emergency-count').innerText=contacts.filter(c=>c.emergency && !c.blocked).length;}

function renderGrid(gridId,data){
  const grid=document.getElementById(gridId);grid.innerHTML='';
  data.forEach(c=>{
    grid.innerHTML+=`<div class="contact-card">
      <button class="fav-btn ${c.favorite?'active':''}" onclick="toggleFav(${c.id})">${c.favorite?'❤️':'🤍'}</button>
      <div class="contact-avatar">${c.avatar?`<img src="${c.avatar}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`:c.name[0]}</div>
      <div class="contact-name">${c.name}</div>
      <div class="contact-phone">${c.phone||''}</div>
      <div class="contact-email">${c.email||''}</div>
      <div class="contact-blood">${c.blood||''}</div>
      <div class="contact-group">${c.group||''}</div>
      <div class="contact-actions">
        <a class="action-btn call-btn" href="tel:${c.phone}"><i class="fas fa-phone"></i></a>
        <a class="action-btn msg-btn" href="sms:${c.phone}"><i class="fas fa-comment"></i></a>
        <button class="action-btn edit-btn" onclick="editContact(${c.id})"><i class="fas fa-edit"></i></button>
        <button class="action-btn delete-btn" onclick="deleteContact(${c.id})"><i class="fas fa-trash"></i></button>
        <button class="action-btn location-btn" onclick="trackLocation(${c.id})"><i class="fas fa-map-marker-alt"></i></button>
        <button class="action-btn block-btn" onclick="toggleBlock(${c.id})">${c.blocked?'<i class="fas fa-unlock"></i>':'<i class="fas fa-ban"></i>'}</button>
      </div>
    </div>`;
  });
}

// ---------- FAVORITE / BLOCK ----------
function toggleFav(id){let c=contacts.find(c=>c.id===id);c.favorite=!c.favorite;saveContacts();renderAll();renderFavorites();renderGroups();renderPrivate();renderBlocked();renderEmergency();}
function toggleBlock(id){let c=contacts.find(c=>c.id===id);c.blocked=!c.blocked;saveContacts();renderAll();renderFavorites();renderGroups();renderPrivate();renderBlocked();renderEmergency();}

// ---------- ADD / EDIT ----------
function openModal(type,id=null){
  editingId=id;
  document.getElementById('modal').style.display='flex';
  document.getElementById('contact-form').reset();
  document.getElementById('avatar-preview').innerHTML='👤';
  document.getElementById('modal-title').innerText=type==='add'?'Add Contact':'Edit Contact';
  if(type==='edit' && id!==null){
    let c=contacts.find(c=>c.id===id);
    document.getElementById('name').value=c.name;
    document.getElementById('phone').value=c.phone;
    document.getElementById('email').value=c.email;
    document.getElementById('birthday').value=c.birthday;
    document.getElementById('blood').value=c.blood;
    document.getElementById('group').value=c.group;
    document.getElementById('notes').value=c.notes;
    document.getElementById('emergency').checked=c.emergency||false;
    document.getElementById('private').checked=c.private||false;
    if(c.avatar)document.getElementById('avatar-preview').innerHTML=`<img src="${c.avatar}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
  }
}
function closeModal(){document.getElementById('modal').style.display='none';editingId=null;}
function previewAvatar(){let file=document.getElementById('avatar').files[0];if(file){let reader=new FileReader();reader.onload=e=>{document.getElementById('avatar-preview').innerHTML=`<img src="${e.target.result}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;};reader.readAsDataURL(file);}}
document.getElementById('contact-form').addEventListener('submit',function(e){e.preventDefault();saveContact();closeModal();});

function saveContact(){
  let c={
    id:editingId||Date.now(),
    name:document.getElementById('name').value,
    phone:document.getElementById('phone').value,
    email:document.getElementById('email').value,
    birthday:document.getElementById('birthday').value,
    blood:document.getElementById('blood').value,
    group:document.getElementById('group').value,
    notes:document.getElementById('notes').value,
    emergency:document.getElementById('emergency').checked,
    private:document.getElementById('private').checked,
    blocked: false, // new
    avatar:document.getElementById('avatar-preview').querySelector('img')?document.getElementById('avatar-preview').querySelector('img').src:''
  };
  if(editingId){let index=contacts.findIndex(x=>x.id===editingId);contacts[index]=c;}else{contacts.push(c);}
  saveContacts(); renderAll();renderFavorites();renderGroups();renderPrivate();renderBlocked();renderEmergency();
}
function editContact(id){openModal('edit',id);}
function deleteContact(id){if(confirm('Delete this contact?')){contacts=contacts.filter(c=>c.id!==id);saveContacts();renderAll();renderFavorites();renderGroups();renderPrivate();renderBlocked();renderEmergency();}}

// ---------- LOCAL STORAGE ----------
function saveContacts(){localStorage.setItem('contacts',JSON.stringify(contacts));}

// ---------- SEARCH ----------
function searchContacts(){
  let q=document.getElementById('search').value.toLowerCase();
  renderGrid('contacts-grid-all',contacts.filter(c=>!c.private && !c.blocked && (c.name.toLowerCase().includes(q) || c.phone.includes(q))));
}

// ---------- GROUP FILTER ----------
function filterGroup(g){renderGrid('contacts-grid-all',contacts.filter(c=>!c.private && !c.blocked && c.group===g));showPage('all');}

// ---------- LOCATION ----------
function trackLocation(id){
  let c=contacts.find(c=>c.id===id);
  if(!navigator.geolocation)return alert('Geolocation not supported.');
  document.getElementById('modal').style.display='flex';
  document.getElementById('modal').innerHTML=`<div class="modal-content">
  <span class="close" onclick="closeModal()">&times;</span>
  <h2>Live Location - ${c.name}</h2>
  <div id="map" style="width:100%;height:400px;border-radius:15px;margin-top:1rem;"></div></div>`;
  navigator.geolocation.watchPosition(pos=>{
    let lat=pos.coords.latitude;
    let lng=pos.coords.longitude;
    document.getElementById('map').innerHTML=`<iframe width="100%" height="400" style="border:0;border-radius:15px;" loading="lazy" allowfullscreen src="https://www.google.com/maps?q=${lat},${lng}&hl=es;z=15&output=embed"></iframe>`;
  },err=>alert('Unable to get location.'));
}

// ---------- HISTORY ----------
function renderHistory(){
  let html='';
  history.forEach(h=>{html+=`<div class="history-card">${h.type.toUpperCase()} ${h.contact} - ${h.time}</div>`;});
  document.getElementById('history-grid').innerHTML=html;
  document.getElementById('history-count').innerText=history.length;
}

// ---------- VOICE SEARCH ----------
function toggleVoiceSearch(){
  if(!('webkitSpeechRecognition' in window)){alert('Voice search not supported.');return;}
  recognition = new webkitSpeechRecognition();
  recognition.lang='en-US';
  recognition.continuous=false;
  recognition.interimResults=false;
  recognition.start();
  recognition.onresult=e=>{
    document.getElementById('search').value=e.results[0][0].transcript;
    searchContacts();
  };
}
</script>
</body>
</html>
