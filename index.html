<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Hub 5.0</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#b60e6d,#764ba2);min-height:100vh;}
#app{display:none;}
.header{background:#fff;padding:10px;display:flex;flex-wrap:wrap;gap:10px;}
.nav-tabs button{border:none;padding:10px 15px;cursor:pointer;}
.tab-btn.active{background:#667eea;color:#fff;border-radius:10px;}
.app-page{display:none;padding:15px;}
.app-page.active{display:block;}
.contacts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:15px;}
.contact-card{background:#fff;padding:15px;border-radius:12px;position:relative;}
.contact-avatar{width:55px;height:55px;border-radius:50%;background:#667eea;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;}
.contact-actions button{margin:5px;border:none;padding:8px;cursor:pointer;}
#modal,#private-modal,#location-modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;justify-content:center;align-items:center;}
.modal-content{background:#fff;padding:20px;width:90%;max-width:450px;border-radius:15px;}
.close{float:right;cursor:pointer;}
#map{height:300px;width:100%;margin-top:10px;}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash">
  <h1>Contact Hub</h1>
  <button class="enter-btn" onclick="enterApp()">Enter</button>
</div>

<!-- LOGIN -->
<div id="login-page">
  <div class="login-card">
    <h2>Login</h2>
    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <button class="login-btn" onclick="login()">Login</button>
  </div>
</div>

<!-- APP -->
<div id="app">
<div class="header">
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="showPage('all')">All</button>
    <button class="tab-btn" onclick="showPage('favorites')">Favorites</button>
    <button class="tab-btn" onclick="showPage('blocked')">Blocked</button>
    <button class="tab-btn" onclick="showPrivate()">Private</button>
    <button class="tab-btn" onclick="showPage('history')">History</button>
  </div>
  <input id="search" placeholder="Search" oninput="searchContacts()">
  <button onclick="openModal()">➕ Add</button>
</div>

<div id="page-all" class="app-page active">
  <div class="contacts-grid" id="grid-all"></div>
</div>
<div id="page-favorites" class="app-page">
  <div class="contacts-grid" id="grid-fav"></div>
</div>
<div id="page-blocked" class="app-page">
  <div class="contacts-grid" id="grid-blocked"></div>
</div>
<div id="page-private" class="app-page">
  <div class="contacts-grid" id="grid-private"></div>
</div>
<div id="page-history" class="app-page">
  <div id="history-grid"></div>
</div>

</div>

<!-- ADD / EDIT MODAL -->
<div id="modal">
<div class="modal-content">
<span class="close" onclick="closeModal()">✖</span>
<h3>Add Contact</h3>
<input id="name" placeholder="Name">
<input id="phone" placeholder="Phone">
<label><input type="checkbox" id="shareLocation"> Share my location</label>
<button onclick="saveContact()">Save</button>
</div>
</div>

<!-- PRIVATE MODAL -->
<div id="private-modal">
<div class="modal-content">
<h3>Enter PIN</h3>
<input id="pin" type="password">
<button onclick="unlockPrivate()">Unlock</button>
</div>
</div>

<!-- LOCATION MODAL -->
<div id="location-modal">
<div class="modal-content">
<span class="close" onclick="closeLocationModal()">✖</span>
<h3>Contact Location</h3>
<div id="map"></div>
</div>
</div>

<script>
let contacts=JSON.parse(localStorage.getItem("contacts"))||[];
let PIN=localStorage.getItem("pin")||"1234";
let liveTrackInterval=null;
let currentMap=null;

function enterApp(){splash.style.display="none";login-page.style.display;"flex";}
function login(){if(username.value==="admin"&&password.value==="123"){localStorage.setItem("logged","1");login-page.style.display;"none";app.style.display="block";render();}else alert("Invalid login");}
if(localStorage.getItem("logged")){splash.style.display="none";app.style.display="block";render();}
function showPage(p){document.querySelectorAll(".app-page").forEach(x=>x.classList.remove("active"));document.getElementById("page-"+p).classList.add("active");}

function openModal(){modal.style.display="flex";}
function closeModal(){modal.style.display="none";}

function saveContact(){
  let shareLoc = document.getElementById("shareLocation").checked;
  contacts.push({
    id:Date.now(),
    name:name.value,
    phone:phone.value,
    fav:false,
    blocked:false,
    private:false,
    shareLocation:shareLoc,
    lat:null,
    lng:null
  });
  localStorage.setItem("contacts",JSON.stringify(contacts));
  closeModal();
  render();
}

function render(){
  ["all","fav","blocked","private"].forEach(page=>{
    let grid=document.getElementById("grid-"+page);
    if(grid) grid.innerHTML="";
  });
  contacts.forEach(c=>{
    let card=document.createElement("div");
    card.className="contact-card";
    card.dataset.id=c.id;
    card.innerHTML=`
      <div class="contact-avatar">${c.name[0]}</div>
      <b>${c.name}</b><br>${c.phone}<br>
      <div class="contact-actions">
        <button onclick="toggleFav(${c.id})">❤</button>
        <button onclick="toggleBlock(${c.id})">🚫</button>
        ${c.shareLocation?`<button onclick="viewLocation(${c.id}, true)">📍 Live Location</button>`:
        `<button onclick="askLocation(${c.id})">📍 Share Location</button>`}
      </div>`;
    if(!c.blocked) document.getElementById("grid-all").appendChild(card.cloneNode(true));
    if(c.fav) document.getElementById("grid-fav").appendChild(card.cloneNode(true));
    if(c.blocked) document.getElementById("grid-blocked").appendChild(card.cloneNode(true));
    if(c.private) document.getElementById("grid-private").appendChild(card.cloneNode(true));
  });
}

function toggleFav(id){contacts=contacts.map(c=>c.id===id?{...c,fav:!c.fav}:c);localStorage.setItem("contacts",JSON.stringify(contacts));render();}
function toggleBlock(id){contacts=contacts.map(c=>c.id===id?{...c,blocked:!c.blocked}:c);localStorage.setItem("contacts",JSON.stringify(contacts));render();}
function searchContacts(){let v=search.value.toLowerCase();document.querySelectorAll("#grid-all .contact-card").forEach(c=>{c.style.display=c.innerText.toLowerCase().includes(v)?"block":"none";})}

function showPrivate(){private-modal.style.display;"flex";}
function unlockPrivate(){if(pin.value===PIN){private-modal.style.display;"none";showPage("private");}else alert("Wrong PIN");}

// LOCATION LOGIC
function askLocation(id){
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(pos=>{
      contacts=contacts.map(c=>c.id===id?{...c,shareLocation:true,lat:pos.coords.latitude,lng:pos.coords.longitude}:c);
      localStorage.setItem("contacts",JSON.stringify(contacts));
      render();
      alert("Location shared successfully!");
    },err=>{alert("Location permission denied");});
  }else alert("Geolocation not supported");
}

function viewLocation(id, live=false){
  let c=contacts.find(x=>x.id===id);
  if(!c.lat||!c.lng){alert("Contact location not available");return;}
  location-modal.style.display;"flex";
  setTimeout(()=>{
    if(currentMap) currentMap.remove();
    currentMap=L.map('map').setView([c.lat,c.lng],15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors'}).addTo(currentMap);
    let marker=L.marker([c.lat,c.lng]).addTo(currentMap).bindPopup(c.name).openPopup();
    if(live){
      if(liveTrackInterval) clearInterval(liveTrackInterval);
      liveTrackInterval=setInterval(()=>{
        navigator.geolocation.getCurrentPosition(pos=>{
          c.lat=pos.coords.latitude;
          c.lng=pos.coords.longitude;
          localStorage.setItem("contacts",JSON.stringify(contacts));
          marker.setLatLng([c.lat,c.lng]);
          currentMap.setView([c.lat,c.lng]);
        });
      },5000);
    }
  },100);
}

function closeLocationModal(){location-modal.style.display;"none";if(currentMap) currentMap.remove();if(liveTrackInterval) clearInterval(liveTrackInterval);}
</script>
</body>
</html>
