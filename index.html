<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Hub 5.0</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#b60e6d,#764ba2);min-height:100vh}
button,input,select,textarea{outline:none}

/* splash */
#splash{position:fixed;inset:0;background:#1a1a2e;display:flex;flex-direction:column;justify-content:center;align-items:center;color:white;z-index:1000}
#splash .title{font-size:4rem;color:#4ecdc4;text-shadow:0 0 20px #4ecdc4}
.enter-btn{margin-top:20px;padding:15px 40px;border:none;border-radius:50px;background:linear-gradient(45deg,#ff6b6b,#4ecdc4);color:white;font-size:1.2rem;cursor:pointer}

/* login */
#login-page{display:none;min-height:100vh;justify-content:center;align-items:center}
.login-card{background:white;padding:2rem;border-radius:15px;width:350px;text-align:center}
.login-btn{background:#667eea;color:white;border:none;padding:12px;width:100%;border-radius:10px}

/* app */
#app{display:none}
.header{background:white;padding:1rem;display:flex;gap:1rem;flex-wrap:wrap}
.nav-tabs{display:flex;gap:.3rem;flex-wrap:wrap}
.tab-btn{border:none;padding:10px 15px;border-radius:10px;background:#eee;cursor:pointer}
.tab-btn.active{background:#667eea;color:white}
.controls{margin-left:auto;display:flex;gap:.5rem}
#search{padding:8px 15px;border-radius:20px;border:2px solid #667eea}

.app-page{display:none;padding:1rem}
.app-page.active{display:block}
.contacts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem}

.contact-card{background:white;padding:1rem;border-radius:15px;position:relative}
.contact-avatar{width:50px;height:50px;border-radius:50%;background:#667eea;color:white;display:flex;align-items:center;justify-content:center;font-size:1.2rem}
.contact-actions{display:flex;gap:.4rem;margin-top:.6rem}
.action-btn{width:40px;height:40px;border:none;border-radius:50%;cursor:pointer;color:white}
.call-btn{background:#4ecdc4}
.msg-btn{background:#f9ca24}
.edit-btn{background:#667eea}
.delete-btn{background:#ff6b6b}
.location-btn{background:#ff6b6b}
.fav-btn{position:absolute;top:10px;right:10px;background:none;border:none;font-size:1.2rem;color:#ffd700}

/* modal */
#modal,#private-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);justify-content:center;align-items:center}
.modal-content{background:white;padding:1.5rem;border-radius:15px;width:90%;max-width:450px}
.close{float:right;font-size:1.5rem;cursor:pointer}
</style>
</head>

<body>

<div id="splash">
  <div class="title">Contact Hub</div>
  <button class="enter-btn" onclick="enterApp()">Enter</button>
</div>

<div id="login-page">
  <div class="login-card">
    <h2>Login</h2>
    <input id="username" placeholder="Username"><br><br>
    <input id="password" type="password" placeholder="Password"><br><br>
    <button class="login-btn" onclick="login()">Login</button>
  </div>
</div>

<div id="app">
  <div class="header">
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="showPage('all')">All</button>
      <button class="tab-btn" onclick="showPage('favorites')">Favorites</button>
      <button class="tab-btn" onclick="showPrivate()">Private</button>
    </div>
    <div class="controls">
      <input id="search" placeholder="Search..." oninput="searchContacts()">
      <button class="tab-btn" onclick="openModal('add')">+ Add</button>
    </div>
  </div>

  <div id="page-all" class="app-page active">
    <div class="contacts-grid" id="contacts-grid-all"></div>
  </div>

  <div id="page-favorites" class="app-page">
    <div class="contacts-grid" id="contacts-grid-fav"></div>
  </div>

  <div id="page-private" class="app-page">
    <div class="contacts-grid" id="contacts-grid-private"></div>
  </div>
</div>

<div id="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <form id="contact-form">
      <input id="name" placeholder="Name" required><br><br>
      <input id="phone" placeholder="Phone" required><br><br>
      <label><input type="checkbox" id="private"> Private</label><br><br>
      <button class="login-btn">Save</button>
    </form>
  </div>
</div>

<div id="private-modal">
  <div class="modal-content">
    <span class="close" onclick="closePrivateModal()">&times;</span>
    <input id="private-pin" placeholder="Enter PIN"><br><br>
    <button class="login-btn" onclick="unlockPrivate()">Unlock</button>
  </div>
</div>

<script>
let contacts=JSON.parse(localStorage.getItem("contacts"))||[];
let editingId=null;
let PRIVATE_PIN=localStorage.getItem("privatePin")||"1234";

function enterApp(){
  splash.style.display="none";
  login-page.style.display;"flex";
}

function login(){
  if(username.value==="admin"&&password.value==="123"){
    login-page.style.display;"none";
    app.style.display="block";
    renderAll();
  }else alert("Invalid");
}

function showPage(p){
  document.querySelectorAll(".app-page").forEach(x=>x.classList.remove("active"));
  document.getElementById("page-"+p).classList.add("active");
}

function openModal(){
  modal.style.display="flex";
  contact-form.reset();
  editingId=null;
}
function closeModal(){modal.style.display="none"}

contact-form.onsubmit;e=>{
  e.preventDefault();
  const c={id:editingId||Date.now(),name:name.value,phone:phone.value,private:private.checked,favorite:false};
  if(editingId) contacts=contacts.map(x=>x.id===editingId?c:x);
  else contacts.push(c);
  localStorage.setItem("contacts",JSON.stringify(contacts));
  closeModal();renderAll();
};

function contactCard(c){
  return `
  <div class="contact-card">
    <div class="contact-avatar">${c.name[0]}</div>
    <b>${c.name}</b><br>${c.phone}
    <div class="contact-actions">
      <button class="action-btn call-btn" onclick="callContact('${c.phone}')"><i class="fas fa-phone"></i></button>
      <button class="action-btn msg-btn" onclick="msgContact('${c.phone}')"><i class="fas fa-comment"></i></button>
      <button class="action-btn edit-btn" onclick="editContact(${c.id})"><i class="fas fa-edit"></i></button>
      <button class="action-btn delete-btn" onclick="deleteContact(${c.id})"><i class="fas fa-trash"></i></button>

      <!-- LOCATION SHARING -->
      <button class="action-btn location-btn" onclick="shareLocation(${c.id})">
        <i class="fas fa-location-dot"></i>
      </button>
      <button class="action-btn location-btn" onclick="viewLocation(${c.id})">
        <i class="fas fa-map"></i>
      </button>
    </div>
    <button class="fav-btn" onclick="toggleFav(${c.id})">❤️</button>
  </div>`;
}

function renderAll(){
  contacts-grid-all.innerHTML;contacts.map(contactCard).join("");
  contacts-grid-fav.innerHTML;contacts.filter(c=>c.favorite).map(contactCard).join("");
}

function toggleFav(id){
  contacts=contacts.map(c=>c.id===id?{...c,favorite:!c.favorite}:c);
  localStorage.setItem("contacts",JSON.stringify(contacts));
  renderAll();
}

function deleteContact(id){
  contacts=contacts.filter(c=>c.id!==id);
  localStorage.setItem("contacts",JSON.stringify(contacts));
  renderAll();
}

function callContact(p){alert("Calling "+p)}
function msgContact(p){alert("Messaging "+p)}

/* ---------- LOCATION SHARING ---------- */
function shareLocation(id){
  const link=`${location.origin}${location.pathname}?shareLocation=${id}`;
  navigator.clipboard.writeText(link);
  alert("Location link copied. Send to contact.");
}

const params=new URLSearchParams(location.search);
const shareId=params.get("shareLocation");

if(shareId){
  navigator.geolocation.watchPosition(pos=>{
    let {latitude,longitude}=pos.coords;
    let list=JSON.parse(localStorage.getItem("contacts"))||[];
    list=list.map(c=>c.id==shareId?{...c,location:{lat:latitude,lng:longitude,time:new Date().toLocaleString()}}:c);
    localStorage.setItem("contacts",JSON.stringify(list));
    document.body.innerHTML="<h2 style='text-align:center'>📍 Location Shared Successfully</h2>";
  });
}

function viewLocation(id){
  let c=contacts.find(x=>x.id===id);
  if(!c||!c.location){alert("No location yet");return}
  window.open(`https://www.google.com/maps?q=${c.location.lat},${c.location.lng}`);
}

/* ---------- PRIVATE ---------- */
function showPrivate(){private-modal.style.display;"flex"}
function closePrivateModal(){private-modal.style.display;"none"}
function unlockPrivate(){
  if(private-pin.value===PRIVATE_PIN){
    closePrivateModal();
    contacts-grid-private.innerHTML;contacts.filter(c=>c.private).map(contactCard).join("");
    showPage("private");
  }else alert("Wrong PIN");
}
</script>

</body>
</html>
